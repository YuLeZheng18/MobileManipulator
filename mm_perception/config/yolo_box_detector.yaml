# YOLO 盒子识别 + 抓取位姿节点参数 (契约 §1 抓取版).
# 用法: ros2 run mm_perception yolo_box_detector --ros-args --params-file <此文件>
#   或由 launch 加载.
yolo_box_detector:
  ros__parameters:
    # ---- 模型 ----
    # 自训练盒子模型 (类别 1/2/3/4). 留文件名, launch 解析为包内 share/models/ 下.
    #   best_ncnn_model = NCNN 导出目录 (ARM CPU 加速 ~4.8x, 见下). 用 best.pt 走原生权重.
    # 绝对路径后覆盖此值; 直接 ros2 run 时需自行传绝对路径.
    model_path: best_ncnn_model
    # NCNN/ONNX 导出格式无法自动识别 task, 必须显式指定, 否则 res.obb 变 None.
    #   用 .pt 原生权重时留空 '' (自带 task).
    model_task: obb
    # YOLO 置信度阈值. 2026-07-28 从 0.8 降到 0.5: 实测该盒子的置信度就压在 0.80 上下抖,
    # 成功帧的 conf 只出现 0.80/0.81 两个值(分布被阈值削平) —— 2427 帧无框 vs 124 帧有框,
    # 检出率 5%, 发布率从 ~11Hz 塌到 0.43Hz. 抓取端 avgAxisAngle 要连取 5 帧新鲜(0.5s 内)
    # 观测, 这个帧率下必然取到陈旧/退化值, 正是 yaw 闭环追到 ±90° 假值的上游原因.
    # 现场只有这四类盒子、无干扰物, 阈值没必要卡这么紧; 误检多再往上抬.
    conf: 0.5
    imgsz: 640                      # 推理输入尺寸. 必须与 NCNN 导出固化尺寸一致(现 best_ncnn_model 是 640
                                    #   导出的; 不一致会框错位/不准!). 换 imgsz 须重导 NCNN 用同尺寸.
                                    #   pytorch CPU 实测: 640≈0.9 480≈1.4 416≈1.9 320≈3.2FPS (慢, 故默认走 NCNN)
                                    #   NCNN 实测:        640≈4.1 480≈5.0 416≈5.3 320≈5.6FPS (加速 1.8~4.8x)
    device: 'vulkan:0'              # NCNN 走 Vulkan GPU (Jetson Orin nvgpu). 实测 640: 14.7FPS vs CPU 4.8 (3x).
                                    #   绕开 torch CUDA 驱动版本问题(torch cuda 仍不可用). 仅 NCNN 支持 vulkan.
                                    #   若用 .pt 原生权重: 改回 'cpu' (torch 无法用 vulkan, 且 cuda 不可用).
    class_names: ['1', '2', '3', '4']   # 只保留这四类盒子, 滤掉其它误检

    # ---- 话题 (RealSense 默认命名空间 camera/camera) ----
    color_topic: /camera/camera/color/image_raw
    # 本机彩色标定坏(K/外参 NaN), aligned_depth 全废 -> 走原始深度流.
    use_raw_depth: true             # true=原始深度流(本机必需); false=aligned_depth
    depth_topic: /camera/camera/depth/image_rect_raw       # 原始深度(848x480)
    camera_info_topic: /camera/camera/color/camera_info    # 彩色内参(NaN->fallback)
    depth_info_topic: /camera/camera/depth/camera_info     # 深度内参(有效, 反投影用)
    depth_is_best_effort: true      # RealSense 图像走 BEST_EFFORT

    # ---- 坐标系 ----
    camera_frame: Link_30           # 深度相机 URDF link
    base_frame: base_link           # 目标系 (契约 §1)
    apply_optical_rotation: true    # 反投影(光学系)->Link_30 机械系

    # ---- ROI 内深度分割 ----
    min_depth: 0.15                 # 有效深度下限(米)
    max_depth: 3.0                  # 有效深度上限(米)
    min_box_height: 0.02            # 高出台面多少算盒子(米)
    max_box_height: 0.5             # 高出台面超此值视为噪声(米)
    center_patch: 9                 # 中心深度邻域, 调大取中值更稳
    roi_shrink: 0.08                # ROI 四周向内收缩比例, 避开框边噪声
    min_mask_px: 300                # ROI 内盒子掩码最小像素, 少于此退化为整 ROI

    # ---- 内参兜底 (本机彩色 camera_info K 若为 NaN) ----
    use_fallback_on_nan: true       # 仿真 K 完好则用不到; 实机 K 坏时先跑通(有系统误差)
    fallback_fx: 900.0              # 1280x720 粗估
    fallback_fy: 900.0

    # ---- 输出 (契约 §1) ----
    publish_pose: true              # 发 /perception/object_pose (PoseStamped) + object_poses (PoseArray)
    pose_topic: /perception/object_pose      # 单目标: 恒发面积最大框 (抓取一次一个)
    poses_topic: /perception/object_poses    # 多目标: 所有盒子位姿数组 (PoseArray, 面积降序)
    only_largest: false             # false=检测/画/打印所有盒子; 位姿话题仍只发最大框(抓取一次一个).
                                    #   true=检测阶段就只留最大框(窗口也只显示一个).

    # 单目标候选的 base_link z 上限(米): 高于此的框不参与"当前抓取目标"选择, 用来排掉
    # 已经放进托盘的盒子. 高于此值的框仍照常检测/画/进 object_poses 数组, 只是不当抓取目标.
    #
    # 2026-07-29 加. 起因: 单目标恒取"图像面积最大"框, 而托盘在肩后离相机 0.22~0.25m、
    # 地面待抓盒 0.36~0.37m —— 近的成像更大, 于是只要托盘上有盒子进视野, object_pose /
    # object_class / object_thickness / object_point_cam 四个话题会一起指向那个已放好的盒子.
    # 实机后果(第三、四轮实测): ① 粗定位开向托盘方向偏 12~16cm; ② 精修被迫从 118~146mm
    # 往回爬, 前几步全被 refine_max_step(40mm) 截断, 6 步用尽仍差最后一步就收敛;
    # 类别同时报错, 会把盒子放进错误的托盘.
    #
    # 取 z 而不是 x/y 范围: 托盘装在车身(Link_11)上, 它在 base_link 里的坐标恒定, 底盘怎么
    # 移动都不变; x/y 范围则随底盘位姿与盒子摆位变, 要反复重标.
    # 0.06 的余量: 地面盒实测 z≈-0.013~-0.007, 托盘已放盒 z≈+0.116~+0.151, 门限取中间偏低,
    # 对手眼偏差(2~3cm)和堆叠层数都留足余量.
    # 若改成从托盘取盒(卸货 /grasp/unload), 需把此值调高到能覆盖托盘高度, 否则选不到目标.
    pick_z_max: 0.06

    # ---- p_cam 多候选跟踪 (pick_z_max 把所有候选滤掉时, 靠这个决定 object_point_cam 追谁) ----
    # object_point_cam 是 ② 精修的相机系闭环输入, 不受 pick_z_max 门控 (那是过 FK 的判据,
    # 用它掐 p_cam 会把免疫 FK 误差的通道反绑到 FK 上). 但多候选时得选一个:
    # 不能按面积最大选(托盘已放盒离相机近、成像恒定更大, 见上), 改按"与上一帧发出的 p_cam
    # 最近"选 —— ② 精修期间目标在相机系连续小步移动(帧间 <5mm), 而两盒相距十几 cm, 无歧义.
    #
    # 2026-07-30 加. 起因: 臂下插过程中彩色内参坏导致重建 z 随相机距离单调爬升(1:1),
    # 越过 pick_z_max 后四个话题一起哑; 此前的兜底只在"单候选"时发 p_cam, 而托盘上已有盒
    # 进视野时候选=2, 兜底失效 -> ② 试探后取不到 p_cam -> "② 精修失败"(第三个盒实测复现).
    cam_track_timeout: 2.0          # 上一帧 p_cam 超过这么多秒未发则视为无锚点, 多候选时不发
    cam_track_max_jump: 0.10        # 最近候选比上一帧跳超过这么多米视为跟丢, 不发(宁缺勿错)

    # ---- B 路线: 当前目标 类别 + 厚度 (grasp_node 订阅, 按类别分托盘 + 视觉厚度堆叠) ----
    # 与单目标 pose 同步发. 类别取 class_names 数字名解析为 int; 厚度=台面深度-顶面深度(米).
    # 话题名须与 mm_grasp/config/place.yaml 的 class_topic/thickness_topic 一致.
    class_topic: /perception/object_class        # std_msgs/Int32: 当前目标类别(1/2/3/4)
    thickness_topic: /perception/object_thickness # std_msgs/Float32: 当前目标厚度(米)

    # ---- 抓取对齐用的长轴图像角 θ_img (grasp_node 订阅定吸盘朝向) ----
    # OBB 长轴在彩色图像里的角度(度, 折到 (-90,90]), 与单目标 pose 同步发.
    # 为什么抓取不用 object_pose 里的 base_link 系盒 yaw: 那个 yaw = R @ 相机系长轴,
    # R(base_link<-Link_30) 含手眼外参旋转与 FK, 随构型漂 —— 2026-07-27 实测偏 6°
    # (检测报盒 +36.2°, 人工对齐实际需要 -149.7° 而非 -143.7°). 相机固连腕, 故
    # "吸盘长轴在图像里占多少度" 是常数, 在 grasp 侧标定一次(yaw_ref_theta_img/
    # yaw_ref_tool), 整条对齐链不过外参, 也不随构型变.
    axis_angle_topic: /perception/object_axis_angle  # std_msgs/Float32: θ_img(度)

    # ---- 可视化 ----
    # 真机在 Nano 上跑(SSH 无 DISPLAY): true 会让 cv2.imshow 撞 xcb 插件初始化失败,
    # 整个节点 abort (exit -6). 故默认 false. 本机带显示器调试时临时传 -p show_window:=true.
    show_window: false              # 无显示器/远程置 false
