# ===== mm_task 任务列表 + 参数 (仿真用; 真机用 mission_real.yaml) =====
# mission_manager 读此文件, 按 tasks 顺序跑 S0→S5 (架构 §7.2).
#
# initial_pose : S0 发给 AMCL 的已知初值 (map 系). 必须与 Gazebo spawn 位姿一致, 否则定位偏.
# timeouts     : 各阶段超时(秒). localize=S0 等 AMCL 收敛(map->base_link 出现);
#                nav=S1 导航; detect=S3 识别; grasp=S4 抓取一轮 / 整盘卸货.
# max_picks_per_shelf : 单货架连抓上限, 只是防死循环的兜底. 正常终止靠识别数归零或托盘装满.
# tasks        : 逐条 {nav_target, action, tray}.
#   nav_target : lane_graph.yaml 里的 node 名 (p1..p4)
#   action     : grasp  = 去货架 → look 读可抓数 → 循环识别+抓取直到抓空或托盘满 [/grasp/execute]
#                unload = 把 tray 号托盘整盘卸到地面两个卸货点 (不用视觉) [/grasp/unload_tray]
#                none   = 仅导航, 不抓取
#   tray       : 仅 action=unload 用, 卸哪个托盘 (0=右, 1=左). 缺省 0.
#
# ⚠️ 一个货架上有 1~4 个盒, 几个只有识别了才知道, 故不在这里按盒数写死多条 grasp 任务:
#    一条 grasp 任务内部自己循环, 抓空或托盘装满就走 (托盘满不是故障, 后续卸货任务照常跑).
# ⚠️ 全流程绿跑需把 grasp_box 摆到 nav_target 够得着处 (set_entity_state 或世界编辑),
#    否则 S4 IK 不成立. 这属场景摆放, 非状态机问题 (架构 §8.4 允许单独调抓取).

initial_pose: { x: 0.0, y: 0.0, yaw: 3.14159 }   # 必须与 Gazebo spawn 一致 (-x 0 -y 0 -Y pi)

timeouts: { localize: 20.0, nav: 120.0, detect: 10.0, grasp: 150.0 }

max_picks_per_shelf: 4

tasks:
  - { nav_target: p2, action: grasp }               # 去 p2 货架 → 连抓到抓空或托盘满
  - { nav_target: p4, action: unload, tray: 0 }     # 搬到 p4 → 卸 0 号(右)托盘
  - { nav_target: p4, action: unload, tray: 1 }     # 同地点 → 卸 1 号(左)托盘 (空盘自动跳过)
