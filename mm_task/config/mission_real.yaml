# ===== mm_task 真机任务列表 (仿真用 mission.yaml) =====
# 用法: 正常就一条 `ros2 launch mm_bringup real_bringup.launch.py` —— 2026-08-13 起
#   real_bringup 的 mission_file 默认就指到本文件, run_mission/use_cameras/use_perception
#   也默认全开, 不用再传任何参数。
# 单独只跑状态机 (栈已经在跑时): ros2 launch mm_task mission.launch.py use_sim_time:=false \
#         mission_file:=$(ros2 pkg prefix mm_task)/share/mm_task/config/mission_real.yaml
#
# 字段含义与 mission.yaml 相同, 这里只记与仿真不同的取值理由.
#
# initial_pose: 真机开机位姿 = 建图起点(地面用 L 形胶带标出), 即 map 原点 (0,0,0).
#   开机把车推回胶带处即可, 不需要每次重标. 该点净距实测 0.700m, 是全图最开阔处,
#   起步自转全角度无碰撞. 若换场地/重建图, 才需要 RViz 2D Pose Estimate + 读 /amcl_pose.
#
# nav_target: 必须是 mm_navigation/config/lane_graph.yaml 里的节点名.
#   取货 pick1..pick4 / 放货 place1(死头位, 靠 hold_yaw 倒着进) place2 / 原点 home.
# timeouts: grasp 从 150 抬到 240 —— 真机一条 grasp 任务内部要连抓多个盒 (每盒 ①粗定位
#   ②相机系精修闭环 ③下插 + 放托盘, 单盒几十秒), 而 unload_tray 一次调用要卸完整盘 2 个盒.
#   超时是按"一次服务调用"算的, 不是整条任务.
# nav 从 120 抬到 180: 真机 MPPI 遇障要绕, 比仿真慢.
# nav 再从 180 抬到 300 (2026-08-13): place1->place2 那趟车楔在墙角, lane_navigator 的慢恢复
#   连报 75 次 replan failed 空转 150s, 第 76 次成功并在 12s 后真到了 place2 —— 但 180s 超时
#   已经先判了任务失败。⚠️ 这条**单独改是掩盖不是修**: 真修在 lane_navigator 的"清 costmap
#   + 倒车脱困"(同日新增), 这里只是给那套恢复留出施展时间, 免得脱困刚见效就被掐表。

initial_pose: { x: 0.0, y: 0.0, yaw: 0.0 }   # = 建图起点(地面 L 形胶带), 也是 lane_graph 的 home

timeouts: { localize: 30.0, nav: 300.0, detect: 15.0, grasp: 240.0 }

max_picks_per_shelf: 4

# ===== 2026-08-12 任务流程调整 =====
# 4 个 pick 一字排开抓, 任一货架抓满 (tray_free=0) 即跳过后续 grasp 直接进 unload.
# 卸货永远先左(tray=1)后右(tray=0); place1=新 cw 位朝南, place2=东端朝北.
# 抓满跳卸靠 mission_manager 的 self._tray_full 标志 + run_mission while-idx 跳过 grasp.
tasks:
  - { nav_target: pick1, action: grasp }               # 货架前连抓, 抓空或两盘装满即走
  - { nav_target: pick2, action: grasp }
  - { nav_target: pick3, action: grasp }
  - { nav_target: pick4, action: grasp }
  - { nav_target: place1, action: unload, tray: 1 }     # 卸 1 号(左)托盘, 永远先卸左
  - { nav_target: place2, action: unload, tray: 0 }     # 卸 0 号(右)托盘
  - { nav_target: home, action: none }                  # 收工回建图起点(胶带处), 下轮开机即就位
