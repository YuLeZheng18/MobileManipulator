bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    # 注意: SimpleProgressChecker 分不清"到点减速/蠕动"和"被卡". 既要 xy 容差收紧(到点更准)
    # 又接受终端蠕动, 就必须放宽时间窗, 否则收紧后最后几 cm 的低速爬行(<0.8cm/s)会在 ~3s 内
    # 挪不够 required_movement_radius 而 ABORT -> 触发 lane_navigator 重试/重规划在终点反复打转.
    # movement_time_allowance 3.0->10.0: 给末端蠕动充足时间走完, 不误判(代价: 真卡死要 10s 才察觉,
    # 可接受). "遇障要快"靠 MPPI 提前横移(ObstaclesCritic/vy)绕障, 不靠这个扳机.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    # xy 容差 0.25->0.10: 用户要到点位置更准, 由 MPPI 负责开到目标(不再用节点闭环平移接管).
    # 代价是终点附近 MPPI 会低速蠕动收尾(已接受), 故上面 progress_checker 时间窗放宽到 10s
    # 防蠕动被误判 ABORT. yaw 容差留 0.1 但终点朝向实际由 lane_navigator 的 cspin 闭环精对(~1°),
    # 这里只作 MPPI drive 段的退出条件. 更高精定位仍与 ArUco 伺服互补.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.1
    # MPPI 全向局部控制器: 保留横移避障, 软约束车头朝向路径方向(雷达 180° 需求)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      # 0.2->0.05: 必须随 vy_max 同改。采样标准差远大于上限时大半 batch 被截断到 ±vy_max,
      # 等于用 2000 条轨迹里的一小部分做优化, 白烧算力还降低有效样本数。
      vy_std: 0.05
      wz_std: 0.4
      # 0.36->0.22: 全图瓶颈是去 place1 的南北通道, 精确欧氏距离变换实测净距 **0.300m**
      # (旧注释写 0.350m 是当时用 4 连通 BFS 当净距场算的, 那给的是曼哈顿距离、系统性
      #  高估最多 28%, 已换精确 EDT 修正)。
      # 按固件斜坡 MAX_LIN_ACCEL=0.6 算, 0.22m/s 的刹车距离 v^2/2a = **4.0cm**,
      # 恰好等于 robot_radius 0.26 在该通道里的单侧余量 (0.300-0.26)。原 0.36 要 10.8cm。
      # ⚠️ 这两个 4.0cm 数值相等是巧合, 不是同一个失效模式: 刹车距离管"朝墙开能否刹住",
      #    而单侧余量是 costmap 的 INSCRIBED 边界(通道内车沿走廊纵向走, MPPI 本就不往
      #    横向瞄)。故 0.22 有余量、不必再降; 但也别往上调。
      # (勘误: 早期注释写"门洞净距 0.200m"是错的 —— 那个 0.200m 窄口存在, 但不在任何
      #  必经路线上, 车道图走的是更宽的绕行。)
      # ⚠️ 必须与下方 velocity_smoother.max_velocity 同改, 只改一处另一处成瓶颈。
      vx_max: 0.22
      vx_min: -0.22
      # 0.22->0.05 (2026-08-11 用户实机要求"严格按车道走, 车头循车道方向"):
      # 全向底盘从 A 到 B 最省的运动是斜向平移, 故 vy 放开时 MPPI 必然抹掉车道图的
      # 正交折线与 0.3m 圆角、走弦斜插过去 —— 首次真机跑 pick1 实测就是这个形态。
      # 压到 0.05 只留"末端微调/贴墙微让"的余量, 迫使车必须先把头转到车道方向再纵向开。
      # ⚠️ 代价: 放弃 MPPI 的横移绕障 (原注释"遇障要快靠提前横移"不再成立), 遇障退化为
      #    减速/停下等全局重规划。这是用户明确接受的取舍。
      # ⚠️ 不改成 motion_model: DiffDrive —— 那会彻底禁掉 vy, 末端连几 cm 的横向修正都做不了。
      vy_max: 0.05
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      reset_period: 1.0
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      # 朝向双保险: PathAlignCritic(use_path_orientations) 软锁车头到路径 pose 朝向(=本段
      # 车道方向); PathAngleCritic(大死区)给"朝目标方向前进"的方向承诺, 防止 MPPI 在含后退段
      # 的路径上把"原地不动"当最优而冻结. 死区放大 -> 容忍横移绕障, 只在车头偏太多才纠正,
      # 故绕障仍是定向横移、不跟绕障曲线拐头.
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0
        threshold_to_consider: 0.8
      # repulsion_weight 决定"靠近软膨胀就减速躲"的强度: 太大 -> 沿墙正常行驶也被拽慢.
      # 调回小值让车不怕墙的软膨胀; 真碰撞由 critical_weight/collision_margin 兜底(保留).
      # 把路径推离障碍交给"全局 costmap 大膨胀", 不靠这里(两套 costmap 职责分离).
      # ⚠️ 这里的 inflation_radius/cost_scaling_factor 不是独立参数, 必须与
      #    local_costmap.inflation_layer **逐字一致** —— MPPI 用它们把代价值反算回
      #    "离障碍多远", 对不上则整条轨迹的距离估计系统性偏移。随 R 同步 0.22 -> 0.26。
      # consider_footprint 保持 false: 换成圆形口径后内切 == 外接 == 0.26, 该开关管的
      #    "低于外接半径阈值就直接放过、否则做完整多边形检查"两级判定退化成一级,
      #    开了只是白烧算力(batch 2000 x 56 步 = 11.2 万点), 拿不到任何额外精度。
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.2
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.08
        near_goal_distance: 0.5
        inflation_radius: 0.26
        cost_scaling_factor: 8.0
      # 贴路径主力。18->28 且 offset_from_furthest 20->6 (2026-08-11):
      # offset_from_furthest 是"从轨迹最远端往回数多少个点才开始算对齐代价", nav2 默认 20
      # 在本车上等于只对齐 0.6m 视野的最前端 —— 圆角弧长才 ~0.47m, 整段弧都落在被忽略的
      # 区间里, 于是弧线被抹平成弦。收到 6 让近端逐点都受罚, 车才会真正贴着弧走。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 28.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 6
        use_path_orientations: true
      # threshold_to_consider 必须 >= GoalCritic.threshold(0.6), 否则出现"死区":
      # 离终点 0.6~1.4m 时 PathFollow 已关、GoalCritic 还没开 -> 没有任何 critic 推前进,
      # MPPI 退化成 ~1.5cm/s 蠕动并触发 progress 失败反复重规划(曾导致"没到拐角就卡死").
      # 设 0.5(< GoalCritic 0.6)使两者首尾相接无缝衔接: 远处 PathFollow 推进, 近终点 GoalCritic 接管减速.
      # 11 -> 22 (2026-08-11, 实测): 必须与 PathAlignCritic 同量级, 否则车只会爬不会走。
      # 上一轮把 PathAlign 拉到 28 而这里留 11, 贴路径的罚是前进推力的 2.5 倍 ——
      # MPPI 一发现开快了会让 56x0.05=2.8s 预测窗内的横向偏差累积、对齐代价飙升,
      # 就**用减速去换贴合**, 越贴越慢越慢越贴, 荡成锯齿油门。
      # 实测 (home->pick1, logs_0811/cmdvel3.log): 直线段 vx 以 ~1.5s 周期在 0.11 <-> 0.014
      # 之间来回荡, 全程均值仅 **0.045**, 从没摸到 vx_max=0.22 —— 限幅根本没起作用。
      # ⚠️ 修法是抬 PathFollow 而不是压 PathAlign: 后者是"循车道方向"的主力(用户硬需求),
      #    压了车就又开始走弦斜插。两者要一起加减, 只动一边就是在速度和贴合间跷跷板。
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 22.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5
      # 方向承诺(防冻结)+ 横移容忍: mode 0(FORWARD_PREFERRED)看"到最远路径点的方向",
      # 给"沿路径向目标前进"的承诺 -> 含后退段的路径也不会被优化器判成"原地不动最省".
      # max_angle_to_furthest 放大到 1.0(~57° 死区): 车头在 ±57° 内不罚 -> 横移绕障被容忍,
      # 只有偏太多才扳车头(锁头主力仍是 PathAlignCritic use_path_orientations).
      # max_angle_to_furthest 1.0->0.35 (57°->20°), cost_weight 6->10 (2026-08-11):
      # 这个死区就是"车头允许偏离行进方向多少度不受罚"。原先 57° 是为了容忍横移绕障而
      # 刻意放大的, 但它同时也放行了"头不动、身子斜着挪"这种走法。收到 20° 后车头必须
      # 大致对着行进方向, 与 PathAlignCritic 的 use_path_orientations 一起把头锁在车道方向。
      # ⚠️ 别收到 0: mode 0 (FORWARD_PREFERRED) 的方向承诺是防"MPPI 把原地不动判成最优"
      #    的那道保险, 死区太小会在起步瞬间(车头还没转过来)给出巨额代价而把车压死。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.35
        mode: 0
      # 0.5 -> 0.0 (2026-08-11, 实测必改): 这个 critic 罚的是"原地旋转"。它本来是给
      # 全向车防"一边横移一边乱转"用的 —— 但 vy_max 已压到 0.05, 横移没了, 过弯**唯一**
      # 的办法就是转车头, 于是它从"防乱转"退化成纯阻力。
      # 实测 (place2->pick1, logs_0811/cmdvel2.log): 在 c_e 那个 90° 弯上车冻了 237 帧
      # ≈ 11.8s, |vx|<0.03 且 max|wz| 只有 **0.241** (wz_max 明明是 1.0) —— 转速被这个
      # critic 压住转不过弯, 位移不够触发 SimpleProgressChecker 的 8cm/10s -> controller
      # "Failed to make progress" ABORT -> lane_navigator 走 NavFn 重规划绕行才脱困。
      # ⚠️ 别改 progress_checker 的 10s 窗口来"治"这个: 90° 弯在 wz_max=1.0 下本该 ~2s
      #    转完, 超时是转速被压的**症状**不是病根, 放宽窗口只会把冻结时间拉得更长。
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # ===== robot_radius 圆形 (2026-08-10 取代 footprint 多边形, 用户决定) =====
      # 车的真实几何(STL 实测顶点, 非估): base_link 0.3614长 x 0.3745宽(半宽 0.187),
      # 托盘 Link_11 经 Joint_5 变换后 x∈[-0.2893,-0.1313] y∈[-0.1099,+0.1106]
      # —— 托盘往**后**伸而横向比底盘还窄。合并包络 0.470长 x 0.3745宽。
      #
      # ⚠️ 为什么放弃 footprint 多边形: 上一版写的
      #      "[[0.19,0.195],[0.19,-0.195],[-0.30,-0.195],[-0.30,0.195]]"
      #    是**外包络长方形**, 它的后两角 (-0.30,±0.195) 实际是空的(托盘只到 y=±0.11)。
      #    那两个幽灵角把外接圆撑到 0.3578, 于是所有校验都偏保守 4.8cm, 曾误判出
      #    "南北通道不能自转 / place1 揉头只剩 2.5cm"这类结论 —— **全部作废**。
      #    真外接圆 = sqrt(0.2893^2+0.1106^2) = **0.3097**。
      #
      # ===== 为什么取 0.26 (不是更大也不是更小) =====
      # 瓶颈是去 place1 的南北通道: 精确欧氏距离变换实测净距 **0.300m**。
      # robot_radius 定的是 INSCRIBED 硬禁区半径, 故通道里可用中线带宽 = 2*(0.300-R):
      #   R=0.24 -> 12.0cm 带宽 / 托盘欠保护 6.9cm / 可站面积 67.6%
      #   R=0.26 -> * 8.0cm 带宽 / 托盘欠保护 5.0cm / 可站面积 62.6%   <= 采用
      #   R=0.28 ->  4.0cm 带宽 / 托盘欠保护 2.9cm / 可站面积 61.5%
      #   R=0.30 ->  0.0cm 带宽 = 通道堵死, place1 直接不可达
      # 取 0.26 的判据是 **8cm 带宽 > AMCL 实测落点误差 5~6cm**: R=0.28 只剩 4cm,
      # 车会经常被判成已在 INSCRIBED 区内, NavFn 去 place1 会无故失败(而且不报有用的错)。
      # ⚠️ 0.26 < 真外接圆 0.3097, 即托盘那 5.0cm 不受 costmap 保护。可接受的理由:
      #    欠保护只在**原地自转**时才可能碰, 而 lane_navigator 只在路线起点/终点自转,
      #    那都是路网节点, 十个节点净距 0.350~0.700 **全部 >= 0.3097**, 自转有 4.0cm 以上
      #    真实余量。通道内净距 0.300 < 0.3097 确实不能自转, 但通道段内没有路网节点 ——
      #    这是 lane_graph.yaml 里写明的设计不变量, 往通道加中间路点会破掉它。
      robot_radius: 0.26
      plugins: ["obstacle_layer", "inflation_layer"]
      # ⚠️ inflation_radius 必须 >= robot_radius, 否则代价地图允许路径贴到比车还近的地方
      # -> 必然蹭障(这是曾经"蹭障"的元凶: 半径 0.20 配膨胀 0.18)。故随 R 同步改 0.22 -> 0.26。
      # 不取更大: 大了会让沿墙行驶持续吃高代价而减速(推离障碍由全局 costmap 大膨胀负责)。
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.26
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # robot_radius 必须与 local_costmap **逐字一致** (取 0.26 的完整依据见那边注释)。
      # 两处不一致的后果: 全局小了 NavFn 会规划出局部走不了的路 (局部判 INSCRIBED 直接
      # 卡住), 大了则过保守。⚠️ 与 footprint 互斥, 换成 robot_radius 时前者必须删掉。
      robot_radius: 0.26
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # 给 NavFn 用: 大半径 + 平缓梯度(cost_scaling 小=代价随距离衰减慢=高代价区更宽),
      # 让低代价"谷底"落在走廊中线 -> NavFn 沿谷底走, 路径居中、离障碍远.
      # (cost_scaling 越大梯度越陡, 障碍旁很快归零, 路径反而能贴障 -> 故这里调小)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # 换 NavFn(Dijkstra): 沿代价场梯度走, 天然往低代价(走廊中间)靠 -> 路径离障碍远;
    # 不像 Theta* 任意角切角贴障. 配合下方全局膨胀梯度调缓, 居中效果更明显.
    # 保留 plugin id "GridBased" 不变, lane_navigator 的 planner_id='GridBased' 无需改.
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    # 放缓 Spin: 底盘 cmd_vel 有 ~1s 平滑滞后, Spin 开环急刹时车身惯性会过冲目标 yaw ~10-15°,
    # 终点没有 MPPI 接管 -> 过冲量直接留成终点 yaw 误差. 降低终端转速 0.45->0.25 使过冲
    # 按 (0.25/0.45)^2 ≈ 1/3 衰减; acc_lim 1.0->0.5 让收尾减速更缓; min 0.15->0.10 留出
    # 低速爬到位的余量, 不被速度地板顶着过冲. 代价: 每次终点对齐多花 ~0.5s.
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 与 MPPI vx_max/vy_max 同为 0.22 (窄过道限速, 理由见上面 FollowPath 处注释)。
    # 这一级是最后的硬限幅: MPPI 即使算出更大值也会被这里削掉, 故两处必须一致 ——
    # 若这里留 0.36 而 MPPI 给 0.22, 限速生效但白留余量; 反之则 MPPI 的规划被截断,
    # 实际轨迹与它预测的不符, 避障判断随之失准。
    max_velocity: [0.22, 0.22, 1.0]
    min_velocity: [-0.22, -0.22, -1.0]
    # 2.5 -> 0.6 对齐固件真实斜坡 (config.h MAX_LIN_ACCEL=0.6, MAX_ANG_ACCEL=3.0)。
    # 原先上位机允许 2.5 而固件只执行 0.6, 差 4 倍: MPPI 按"车能 2.5 加速"预测轨迹,
    # 实车跟不上 -> 预测与现实不符, 避障时机随之失准。宽场地看不出, 0.255m 净距的
    # 窄过道里这个偏差就是撞墙。角向 2.0 -> 3.0 同理(固件角加速度其实更宽松)。
    max_accel: [0.6, 0.6, 3.0]
    max_decel: [-0.6, -0.6, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
