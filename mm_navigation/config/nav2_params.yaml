      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    # 注意: SimpleProgressChecker 分不清"到点减速/蠕动"和"被卡". 既要 xy 容差收紧(到点更准)
    # 又接受终端蠕动, 就必须放宽时间窗, 否则收紧后最后几 cm 的低速爬行(<0.8cm/s)会在 ~3s 内
    # 挪不够 required_movement_radius 而 ABORT -> 触发 lane_navigator 重试/重规划在终点反复打转.
    # movement_time_allowance 3.0->10.0: 给末端蠕动充足时间走完, 不误判(代价: 真卡死要 10s 才察觉,
    # 可接受). "遇障要快"靠 MPPI 提前横移(ObstaclesCritic/vy)绕障, 不靠这个扳机.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    # xy 容差 0.25->0.10: 用户要到点位置更准, 由 MPPI 负责开到目标(不再用节点闭环平移接管).
    # 代价是终点附近 MPPI 会低速蠕动收尾(已接受), 故上面 progress_checker 时间窗放宽到 10s
    # 防蠕动被误判 ABORT. yaw 容差留 0.1 但终点朝向实际由 lane_navigator 的 cspin 闭环精对(~1°),
    # 这里只作 MPPI drive 段的退出条件. 更高精定位仍与 ArUco 伺服互补.
    # 2026-08-12: 以下 stateful/xy/yaw 三项及本文件内多处 ⚠️ 标记参数, 原先靠真机跑起来后
    # ros2 param set 动态调, 未落盘 —— 每次栈重启都要照 task_handoff 记忆里的清单重设一遍,
    # 太容易漏。现按已验证实机效果(路径不贴墙/车不顿/到位2-3cm/速度0.4m/s)直接写死。
    # stateful True->false: 到点后再被推离容差不再判"已完成", 避免误判成功后又被撞偏还不重纠.
    general_goal_checker:
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.03
    # MPPI 全向局部控制器: 保留横移避障, 软约束车头朝向路径方向(雷达 180° 需求)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      # 0.2->0.05: 必须随 vy_max 同改。采样标准差远大于上限时大半 batch 被截断到 ±vy_max,
      # 等于用 2000 条轨迹里的一小部分做优化, 白烧算力还降低有效样本数。
      vy_std: 0.05
      # 0.4->0.2 (2026-08-11, 治"进门口犹豫"): 采样航向的散布。vy_max 已压到 0.05, 行进
      # 方向≈车头方向, 于是航向一散、横向落点跟着散。2.8s 视界(56*0.05)下 wz_std 0.4 的
      # 横向扇形远宽于门口那条 16cm 的免代价带 ⇒ 高速样本几乎全落进罚区, softmax 后只剩
      # "慢下来"的样本存活 —— MPPI 不是在绕障, 是在用降速换横向确定性, 表现即门口爬行。
      # 减半后扇形收窄, 高速样本能留在门缝里。与本设计天然相符: 转向由 lane_navigator 的
      # cspin 原地转完成, MPPI 只负责锁切线巡路, 本就不需要大转速采样。
      # ⚠️ 代价: 临场纠偏变钝。若日后发现车贴墙走后回不到中线, 先怀疑这里。
      wz_std: 0.2
      # 0.36->0.22: 全图瓶颈是去 place1 的南北通道, 精确欧氏距离变换实测净距 **0.300m**
      # (旧注释写 0.350m 是当时用 4 连通 BFS 当净距场算的, 那给的是曼哈顿距离、系统性
      #  高估最多 28%, 已换精确 EDT 修正)。
      # 按固件斜坡 MAX_LIN_ACCEL=0.6 算, 0.22m/s 的刹车距离 v^2/2a = **4.0cm**,
      # 恰好等于 robot_radius 0.26 在该通道里的单侧余量 (0.300-0.26)。原 0.36 要 10.8cm。
      # ⚠️ 这两个 4.0cm 数值相等是巧合, 不是同一个失效模式: 刹车距离管"朝墙开能否刹住",
      #    而单侧余量是 costmap 的 INSCRIBED 边界(通道内车沿走廊纵向走, MPPI 本就不往
      #    横向瞄)。故 0.22 有余量、不必再降; 但也别往上调。
      # (勘误: 早期注释写"门洞净距 0.200m"是错的 —— 那个 0.200m 窄口存在, 但不在任何
      #  必经路线上, 车道图走的是更宽的绕行。)
      # ⚠️ 必须与下方 velocity_smoother.max_velocity 同改, 只改一处另一处成瓶颈。
      # 2026-08-12 实机验证后提到 0.4 (原 0.22 derivation 见上, 已被更宽的膨胀带配置取代,
      # 走廊犹豫改靠 inflation_radius/cost_travel_multiplier 等下方同批调整解决, 不再靠限速兜底):
      # 2026-08-14: 0.4 -> 0.3 (用户要"再慢点")。只降前进上限, 不碰 vy/wz —— 末端横向修正
      # 余量(vy 0.1)和过弯转速余量(wz 1.5)都是各自单独调出来的, 跟着降会把老问题带回来。
      # 降速不会重新引出"走廊犹豫": 那个 08-11 已确认是膨胀带/代价权重问题, 不是限速问题。
      vx_max: 0.3
      vx_min: -0.3
      # 0.22->0.05 (2026-08-11 用户实机要求"严格按车道走, 车头循车道方向"):
      # 全向底盘从 A 到 B 最省的运动是斜向平移, 故 vy 放开时 MPPI 必然抹掉车道图的
      # 正交折线与 0.3m 圆角、走弦斜插过去 —— 首次真机跑 pick1 实测就是这个形态。
      # 压到 0.05 只留"末端微调/贴墙微让"的余量, 迫使车必须先把头转到车道方向再纵向开。
      # ⚠️ 代价: 放弃 MPPI 的横移绕障 (原注释"遇障要快靠提前横移"不再成立), 遇障退化为
      #    减速/停下等全局重规划。这是用户明确接受的取舍。
      # ⚠️ 不改成 motion_model: DiffDrive —— 那会彻底禁掉 vy, 末端连几 cm 的横向修正都做不了。
      # 2026-08-12 实机验证后提到 0.1 (原 0.05 太紧, 末端横向修正余量不够); wz_max 1.0->1.5
      # 同批 (90° 弯转速余量, 见下方 TwirlingCritic 段 08-11 实测冻转记录, 那次是权重问题
      # 不是限速问题, 但顺带把限速也放宽留够转弯裕度):
      vy_max: 0.1
      wz_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      # 0.3->0.15 (2026-08-11, 治犹豫): softmax 温度。门口的样本天然分成"冲过去"与
      # "等一等"两簇, 温度越高加权平均越软, 输出就是两簇之间那个谁也不像的中间态 ——
      # 观感正是"犹豫"。压低则更贪心地跟随最优样本, 该冲就冲。
      temperature: 0.15
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      reset_period: 1.0
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      # 朝向双保险: PathAlignCritic(use_path_orientations) 软锁车头到路径 pose 朝向(=本段
      # 车道方向); PathAngleCritic(大死区)给"朝目标方向前进"的方向承诺, 防止 MPPI 在含后退段
      # 的路径上把"原地不动"当最优而冻结. 死区放大 -> 容忍横移绕障, 只在车头偏太多才纠正,
      # 故绕障仍是定向横移、不跟绕障曲线拐头.
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # 2026-08-12 实机验证后提到 20.0/1.5 (原 5.0/0.6 收尾推力不够, 终点前蠕动).
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 1.5
      # 2026-08-12 实机验证后提到 15.0 (原 9.0):
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 0.8
      # repulsion_weight 决定"靠近软膨胀就减速躲"的强度: 太大 -> 沿墙正常行驶也被拽慢.
      # 0.2 -> 0.1 (2026-08-11, "让车敢过点"的第三处): 窄走廊里车**必然**全程贴着软膨胀,
      # 这个权重于是变成一路持续的刹车力, 正是"犹豫/蠕动"的直接来源。真碰撞仍由
      # critical_weight 20.0 + collision_margin_distance 兜底, 那条线没动。
      # collision_margin_distance 0.08 -> 0.05: 这是"离障碍多近开始算撞"的余量, 叠在
      # robot_radius 之上。R 已从 0.26 收到 0.22, 若余量留 0.08 则实际禁区回到 0.30,
      # 白收 —— 两个数要一起降才真的腾出通行带。
      # ⚠️ 这里的 inflation_radius/cost_scaling_factor 不是独立参数, 必须与
      #    local_costmap.inflation_layer **逐字一致** —— MPPI 用它们把代价值反算回
      #    "离障碍多远", 对不上则整条轨迹的距离估计系统性偏移。
      # inflation_radius 0.22 -> 0.35, collision_margin_distance 0.05 -> 0.02
      # (2026-08-11 第二轮, 治"进门口犹豫"):
      #   ① 0.22 == robot_radius 是个陷阱。Nav2 里硬禁区由 robot_radius(内切圆)划定,
      #      inflation_radius 只控制内切圆**之外**那段软衰减。两者相等 ⇒ 软衰减带宽为零,
      #      代价场退化成纯阶跃(0.22 外恒 0, 内直接 253)。MPPI 在门口于是**没有梯度可循**,
      #      不知道自己正在变窄, 只知道再偏一点就掉悬崖 —— 没有引导就只能降速换确定性。
      #      放大到 0.35 后重新有碗形代价谷: 门口(半宽 0.30)中线处 252*e^(-8*0.08)=133,
      #      偏 5cm 处 =198, 谷底在中线 ⇒ 车有方向可循。repulsion_weight 0.1 才终于有
      #      作用对象(此前它作用的衰减区根本不存在)。
      #   ② 余量 0.05 叠在 R 0.22 上 = 实际禁入 0.27, 而门半宽 0.30 ⇒ 横向只剩 3cm 就撞
      #      critical_weight 20 的陡罚。降到 0.02 后余量 3cm -> 6cm。车真实半宽 0.187,
      #      R 0.22 本身已多留 3.3cm, 车皮到墙仍有实际余量。
      # consider_footprint 保持 false: 圆形口径下内切 == 外接 == R, 该开关管的
      #    "低于外接半径阈值就直接放过、否则做完整多边形检查"两级判定退化成一级,
      #    开了只是白烧算力(batch 2000 x 56 步 = 11.2 万点), 拿不到任何额外精度。
      # 2026-08-12 实机验证后 repulsion_weight/critical_weight/inflation_radius 提到
      # 0.03/12.0/0.45 (原 0.1/20.0/0.35): inflation_radius 必须与下方
      # local_costmap.inflation_layer 及 global_costmap.inflation_layer **逐字一致**,
      # 三处已同批改到 0.45 (见各自位置的对应改动).
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        # 2026-08-14 再放宽 0.03/12.0 -> 0.01/8.0 ("路径靠墙就不敢走"):
        # place1->place2 那趟实测 25 次恢复里有两次**规划是成功的**(75/68 poses),
        # 却在 0.7s 内 FollowPath abort —— 即路有, 是 MPPI 自己判贴墙轨迹代价过高而放弃。
        # repulsion 管"靠近软膨胀就减速躲", critical 管"临近硬禁区的陡罚";
        # 走廊净距只有 0.300m, 贴墙是常态不是异常, 这两条压低才谈得上敢过。
        # 真正的硬保护仍是 robot_radius(下方 0.20) + collision_margin_distance(0.02), 没动。
        repulsion_weight: 0.01
        critical_weight: 8.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.02
        near_goal_distance: 0.5
        inflation_radius: 0.45
        cost_scaling_factor: 8.0
      # 贴路径主力。18->28 且 offset_from_furthest 20->6 (2026-08-11):
      # offset_from_furthest 是"从轨迹最远端往回数多少个点才开始算对齐代价", nav2 默认 20
      # 在本车上等于只对齐 0.6m 视野的最前端 —— 圆角弧长才 ~0.47m, 整段弧都落在被忽略的
      # 区间里, 于是弧线被抹平成弦。收到 6 让近端逐点都受罚, 车才会真正贴着弧走。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 28.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 6
        use_path_orientations: true
      # threshold_to_consider 必须 >= GoalCritic.threshold(0.6), 否则出现"死区":
      # 离终点 0.6~1.4m 时 PathFollow 已关、GoalCritic 还没开 -> 没有任何 critic 推前进,
      # MPPI 退化成 ~1.5cm/s 蠕动并触发 progress 失败反复重规划(曾导致"没到拐角就卡死").
      # 设 0.5(< GoalCritic 0.6)使两者首尾相接无缝衔接: 远处 PathFollow 推进, 近终点 GoalCritic 接管减速.
      # 11 -> 22 (2026-08-11, 实测): 必须与 PathAlignCritic 同量级, 否则车只会爬不会走。
      # 上一轮把 PathAlign 拉到 28 而这里留 11, 贴路径的罚是前进推力的 2.5 倍 ——
      # MPPI 一发现开快了会让 56x0.05=2.8s 预测窗内的横向偏差累积、对齐代价飙升,
      # 就**用减速去换贴合**, 越贴越慢越慢越贴, 荡成锯齿油门。
      # 实测 (home->pick1, logs_0811/cmdvel3.log): 直线段 vx 以 ~1.5s 周期在 0.11 <-> 0.014
      # 之间来回荡, 全程均值仅 **0.045**, 从没摸到 vx_max=0.22 —— 限幅根本没起作用。
      # ⚠️ 修法是抬 PathFollow 而不是压 PathAlign: 后者是"循车道方向"的主力(用户硬需求),
      #    压了车就又开始走弦斜插。两者要一起加减, 只动一边就是在速度和贴合间跷跷板。
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 22.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5
      # 方向承诺(防冻结)+ 横移容忍: mode 0(FORWARD_PREFERRED)看"到最远路径点的方向",
      # 给"沿路径向目标前进"的承诺 -> 含后退段的路径也不会被优化器判成"原地不动最省".
      # max_angle_to_furthest 放大到 1.0(~57° 死区): 车头在 ±57° 内不罚 -> 横移绕障被容忍,
      # 只有偏太多才扳车头(锁头主力仍是 PathAlignCritic use_path_orientations).
      # max_angle_to_furthest 1.0->0.35 (57°->20°), cost_weight 6->10 (2026-08-11):
      # 这个死区就是"车头允许偏离行进方向多少度不受罚"。原先 57° 是为了容忍横移绕障而
      # 刻意放大的, 但它同时也放行了"头不动、身子斜着挪"这种走法。收到 20° 后车头必须
      # 大致对着行进方向, 与 PathAlignCritic 的 use_path_orientations 一起把头锁在车道方向。
      # ⚠️ 别收到 0: mode 0 (FORWARD_PREFERRED) 的方向承诺是防"MPPI 把原地不动判成最优"
      #    的那道保险, 死区太小会在起步瞬间(车头还没转过来)给出巨额代价而把车压死。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.35
        mode: 0
      # 0.5 -> 0.0 (2026-08-11, 实测必改): 这个 critic 罚的是"原地旋转"。它本来是给
      # 全向车防"一边横移一边乱转"用的 —— 但 vy_max 已压到 0.05, 横移没了, 过弯**唯一**
      # 的办法就是转车头, 于是它从"防乱转"退化成纯阻力。
      # 实测 (place2->pick1, logs_0811/cmdvel2.log): 在 c_e 那个 90° 弯上车冻了 237 帧
      # ≈ 11.8s, |vx|<0.03 且 max|wz| 只有 **0.241** (wz_max 明明是 1.0) —— 转速被这个
      # critic 压住转不过弯, 位移不够触发 SimpleProgressChecker 的 8cm/10s -> controller
      # "Failed to make progress" ABORT -> lane_navigator 走 NavFn 重规划绕行才脱困。
      # ⚠️ 别改 progress_checker 的 10s 窗口来"治"这个: 90° 弯在 wz_max=1.0 下本该 ~2s
      #    转完, 超时是转速被压的**症状**不是病根, 放宽窗口只会把冻结时间拉得更长。
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # ===== robot_radius 圆形 (2026-08-10 取代 footprint 多边形, 用户决定) =====
      # 车的真实几何(STL 实测顶点, 非估): base_link 0.3614长 x 0.3745宽(半宽 0.187),
      # 托盘 Link_11 经 Joint_5 变换后 x∈[-0.2893,-0.1313] y∈[-0.1099,+0.1106]
      # —— 托盘往**后**伸而横向比底盘还窄。真外接圆 = sqrt(0.2893^2+0.1106^2) = **0.3097**。
      #
      # ⚠️ 为什么放弃 footprint 多边形: 上一版写的
      #      "[[0.19,0.195],[0.19,-0.195],[-0.30,-0.195],[-0.30,0.195]]"
      #    是**外包络长方形**, 它的后两角 (-0.30,±0.195) 实际是空的(托盘只到 y=±0.11)。
      #    那两个幽灵角把外接圆撑到 0.3578, 所有校验都因此偏保守 4.8cm —— 结论全部作废。
      #
      # ===== 0.26 -> 0.22 (2026-08-11, 用户要求"车半径小一点, 让车敢过点") =====
      # 症状: 去 place1 时车在走廊口犹豫半天。根因是那条走廊 EDT 实测净距只有 **0.300m**,
      # 而 robot_radius 定的是 INSCRIBED 硬禁区半径, 走廊里可用中线带宽 = 2*(0.300-R):
      #   R=0.26 ->  8.0cm 带宽   <- 与 AMCL 实测落点误差 5~6cm 同量级, 车一飘就判进禁区
      #   R=0.22 -> 16.0cm 带宽   <= 采用, 是定位误差的约 3 倍, 才谈得上"敢过"
      # 半宽 0.187 是底盘真实半宽, 故 0.22 仍比车身半宽大 3.3cm, 不是把车当质点。
      # ⚠️ 代价: 0.22 距真外接圆 0.3097 差 9.0cm(原先差 5.0cm), 即托盘那一截更不受
      #    costmap 保护。这个欠保护只在**原地自转**时会碰 —— 而 lane_navigator 只在路线
      #    起点和终点自转, 那两处是标定过的停靠位, 净距 0.35~0.70 都 >= 0.3097。
      #    真正的风险是"车在窄处被逼停后重规划、在走廊里自转", 靠 vy_max=0.05 + 切线锁头
      #    使车在走廊内只能直行穿过来规避。若哪天看到托盘蹭墙, 第一个该回调的就是这里。
      # ===== 0.22 -> 0.20 (2026-08-14, 同一句诉求的第二轮: "路径靠墙他不敢走") =====
      # 这是**硬禁区**半径, 也是 place2 那 100s 卡死的直接原因: 25 次恢复里 23 次报
      # `replan failed (status 6)` —— SmacPlanner2D 判**起点**落在 >=253 的内切禁区内就
      # 拒绝出路, 无论目标多空旷。倒车脱困(0.20m x 5 次)全试过无效, 说明那个坑比 20cm 宽,
      # 收禁区比加大倒车更对症。
      #   R=0.22 -> 中线带宽 16.0cm    R=0.20 -> 20.0cm (定位误差 5~6cm 的 3.3 倍)
      # 真实半宽 0.187, 故 0.20 仍留 1.3cm 余量, 车身本体不会真蹭。
      # ⚠️ 但托盘那一截(真外接圆 0.3097)欠保护从 9.0cm 扩大到 11.0cm。原注释那条纪律不变:
      #   **看到托盘蹭墙, 第一个回调的就是这里**, 回 0.22 而不是去动别的。
      robot_radius: 0.20
      # 显式 0.0: nav2 默认 0.01, 会悄悄把上面的半径再撑 1cm(0.20 -> 0.21)。
      # 数值小但方向错 —— 这一版的整个意图是把禁区收紧到刚好够用, 留着默认值等于漏算。
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      # inflation_radius 0.22 -> 0.35 (2026-08-11 第二轮):
      # local costmap 必须与 ObstaclesCritic 的 inflation_radius 保持一致。
      # 两者相等时意味着 MPPI 的距离反算与 costmap 实际代价分布吻合。
      # 理由见 ObstaclesCritic 注释: 0.22==robot_radius → 软衰减带宽为零 → 无梯度 → 犹豫。
      # 2026-08-12 实机验证后再提到 0.45 (与 ObstaclesCritic/global_costmap 同批同改, 三处
      # 逐字一致的纪律不变).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # robot_radius 必须与 local_costmap **逐字一致** (取 0.20 的完整依据见那边注释)。
      # 两处不一致的后果: 全局小了会规划出局部走不了的路 (局部判 INSCRIBED 直接卡住),
      # 大了则过保守。⚠️ 与 footprint 互斥, 换成 robot_radius 时前者必须删掉。
      robot_radius: 0.20
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      # ===== 2026-08-13 加回 obstacle_layer (34db89f 删掉它是"车不会绕障"的根因) =====
      # 删掉后的实机症状: 人往车前一站, 车停在人面前不动, 永远规划不出绕行路径。
      # 机制: lane_navigator 的绕障重规划调 planner_server, 而 planner **只读本图**。
      # 本图里没有 obstacle_layer ⇒ 人根本不存在 ⇒ 每次重规划都返回同一条穿过人的路
      # ⇒ 车再开过去、再被 local costmap 挡停, 死循环。lane_navigator.py 的重规划注释
      # 写着"读 global_costmap 自动绕远", 那个前提在 08-11 之后就不成立了, 两边矛盾。
      # (旁证: 用户实测 08-11 之前单开导航时, 人一站路径立刻绕开。)
      #
      # 当初删它的理由(南北通道净距 0.300m, AMCL 5~6cm 落点误差让同一堵墙在连续帧被打到
      # 不同位置, marking 层层叠加把墙加厚 -> 通道标成 253 -> 规划失败车被困)是真的,
      # 但那是"标记累积"问题, 不该用"全局对动态障碍全盲"来治 —— 代价是把绕障能力整个砍掉。
      # 现在的抑制手段是让**清除跑赢标记**: raytrace_max_range 3.5 > obstacle_max_range 2.0,
      # 即凡是 2.0m 内标下的点, 车走到 3.5m 视线内就会被射线清掉; 雷达滤波后仍有 310° 视野,
      # 车身后方也在扫描范围内, 不存在"驶离就再也清不掉"。
      # ⚠️ 若幻影墙再现(表现: 明明空的通道规划不出路), **只调 obstacle_max_range**
      #    (2.0 往下压到 1.5), 别再整层删掉 —— 删掉就回到本次这个 bug。
      # ⚠️ 故意不做"规划失败就清 global costmap": 清掉的同时人也没了, 规划器立刻给出一条
      #    穿人的路, 车开过去再被局部挡停, 来回震荡, 比幻影墙更危险。
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # 必须是 /scan_filtered 而非 /scan: 原始扫描含车尾机械臂自遮挡, 会把臂建成
          # 跟着车走的幻影墙(见 config/scan_filter.yaml)。
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 清除范围 > 标记范围, 是本层不累积的唯一保证, 两者的大小关系别倒过来。
          raytrace_max_range: 3.5
          raytrace_min_range: 0.2
          obstacle_max_range: 2.0
          obstacle_min_range: 0.2
      # 给规划器用: 平缓梯度(cost_scaling 小 = 代价随距离衰减慢 = 高代价区更宽), 让低代价
      # "谷底"落在走廊中线 -> 规划器沿谷底走, 路径居中、离障碍远。
      # 0.45 -> 0.30 (2026-08-11, "让车敢过点"的另一半):
      # 膨胀半径大于走廊半宽时, **整条走廊全是高代价**, 谷底被抹平 —— 去 place1 那条净距
      # 0.300m 的走廊(半宽 0.15)在 0.45 膨胀下没有一格是低代价, 规划器于是在"进走廊"与
      # "绕远路"之间反复横跳, 表现就是用户看到的"在路口犹豫半天"。
      # 0.30 让走廊中线重新露出可分辨的谷底, 同时仍 > robot_radius 0.22, 宽处照样居中。
      # 2026-08-12 实机验证后再提到 0.45 (与 local_costmap/ObstaclesCritic 同批同改;
      # 走廊犹豫改靠上面 cost_scaling_factor 1.0 的平缓梯度 + planner 的
      # cost_travel_multiplier 一起兜, 不再单靠压小 inflation_radius 硬开洞).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 1.0 -> 2.5 (2026-08-12 实机验证后写死, 此前只在 Nano 上 ros2 param set 过没落盘):
        # 配合 inflation_radius 0.45 用更陡的梯度收窄高代价区宽度, 否则 0.45 半径下
        # 1.0 的平缓梯度会让谷底在窄走廊里被抹平 (与上面 planner cost_travel_multiplier
        # 15.0 是同一批"更宽膨胀带需要更强居中力"的配套调整)。
        cost_scaling_factor: 2.5
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # 2026-08-11 NavFn -> SmacPlanner2D。去掉固定车道图后, 规划器成了**唯一**路径来源,
    # 路径质量直接就是行车质量, 故换成自带平滑器的那个。
    # 差别只有一点但很关键: NavFn 输出的是逐格折线(方向量化到 45° 台阶), 而 lane_navigator
    # 会把每个 pose 的朝向写成切线交给 MPPI 的 PathAlignCritic 锁车头 —— 台阶路径 = 命令
    # 车头在直线上按 45° 来回扭。SmacPlanner2D 规划完自带梯度下降平滑(下面 smoother 段),
    # 输出连续路径, 拐角是圆滑过渡而不是硬折角, 正好顶替掉手写的"顶点倒圆角"。
    # (节点侧还有一道 heading_baseline=0.15m 的前视切线做二次去台阶, 两道叠着来。)
    # ⚠️ plugin id 保持 "GridBased": lane_navigator 写死了 planner_id='GridBased'。
    # ⚠️ 不用 SmacPlannerHybrid/Lattice: 那两个按车辆运动学(最小转弯半径)搜索, 会在
    #    0.30m 净距的走廊里因转弯半径放不下而直接判无解 —— 全向底盘不需要那个约束。
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25          # 目标格被占时可退让的距离; 目标空闲则路径精确落在目标上
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # 代价惩罚权重: 越大越愿意绕远走低代价区(=走廊中线), 越小越贴近最短路。
      # 2.0 是"明显居中但不至于为了躲膨胀绕大圈", 与下面全局膨胀 0.30/2.5 配套。
      # 2026-08-12 实机验证后提到 15.0 (全局膨胀半径同批提到 0.45 更宽, 需要更强的居中
      # 权重才能在更宽的软衰减带里仍然把路径推向中线, 否则贴着一侧走).
      cost_travel_multiplier: 15.0
      # false: 末点朝向用我们传进去的目标 yaw 而不是"最后一段路径方向"。
      # 其实无所谓 —— lane_navigator 收到路径后会把**所有** pose 朝向按切线重写一遍。
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3          # 平滑权重: 抹掉栅格台阶
        # 0.1 -> 0.05 (2026-08-12 实机验证后写死, 此前只在 Nano 上 ros2 param set 过没落盘):
        w_data: 0.05           # 贴原路径权重: 越小平滑器越能把路径推向低代价区(走廊中线)
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    # 放缓 Spin: 底盘 cmd_vel 有 ~1s 平滑滞后, Spin 开环急刹时车身惯性会过冲目标 yaw ~10-15°,
    # 终点没有 MPPI 接管 -> 过冲量直接留成终点 yaw 误差. 降低终端转速 0.45->0.25 使过冲
    # 按 (0.25/0.45)^2 ≈ 1/3 衰减; acc_lim 1.0->0.5 让收尾减速更缓; min 0.15->0.10 留出
    # 低速爬到位的余量, 不被速度地板顶着过冲. 代价: 每次终点对齐多花 ~0.5s.
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 必须与 MPPI vx_max/vx_min/vy_max/wz_max 逐字一致 (理由见上面 FollowPath 处注释) ——
    # 这一级是最后的硬限幅, MPPI 即使算出更大值也会被这里削掉。
    # 2026-08-12 随 FollowPath.vx_max/vx_min/vy_max/wz_max 同批提到 0.4/-0.3/0.1/1.5,
    # 这里必须跟着改, 否则 MPPI 的新限速被这一级悄悄削回 0.22 (旧值), 白改一场。
    # 2026-08-14: vx 随 FollowPath.vx_max 同降到 0.3 (只这一项, y/wz 不动)。
    max_velocity: [0.3, 0.1, 1.5]
    min_velocity: [-0.3, -0.1, -1.5]
    # 2.5 -> 0.6 对齐固件真实斜坡 (config.h MAX_LIN_ACCEL=0.6, MAX_ANG_ACCEL=3.0)。
    # 原先上位机允许 2.5 而固件只执行 0.6, 差 4 倍: MPPI 按"车能 2.5 加速"预测轨迹,
    # 实车跟不上 -> 预测与现实不符, 避障时机随之失准。宽场地看不出, 0.255m 净距的
    # 窄过道里这个偏差就是撞墙。角向 2.0 -> 3.0 同理(固件角加速度其实更宽松)。
    # 2026-08-12 实机验证后再收到 [0.5,0.5,2.0]/[-0.5,-0.5,-2.0] (仍低于固件斜坡 0.6/3.0,
    # 留了余量, 车不顿):
    max_accel: [0.5, 0.5, 2.0]
    max_decel: [-0.5, -0.5, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      # 200 -> 0 (2026-08-12 实机验证后写死): lane_navigator 不用 waypoint_follower 的
      # 多点连续巡航, 每次只发单点 /go_to, 这个停顿从没派上用场, 留着也不影响, 清零对齐现状.
      waypoint_pause_duration: 0
