amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    # 0.2 = 思岚 A3 实测最小量程 (slam_toolbox 启动时会报 "minimum laser range setting
    # exceeds the capabilities of the used Lidar (0.2 m)")。原值 0.15 低于硬件下限,
    # 会把近距噪声点当有效读数纳入 AMCL 似然场匹配。
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.3
    update_min_d: 0.3
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered
    # ===== 自初始化位姿 (2026-08-13 新增) =====
    # 不给这两行时 AMCL 起来是"未初始化"态: 不发 map->odom TF -> map 帧不存在 ->
    # global_costmap 的 activate() 死等 map->base_link -> nav2 的 lifecycle 永远停在
    # "Activating planner_server"。原先靠 mission_manager 的 S0 发 /initialpose 解开
    # (mission_manager.py:334, 值取自 mission_real.yaml 的 initial_pose), 但"人工 go"
    # 四步里状态机是**最后**起的, 中间那段就得人在 RViz 点一次 2D Pose Estimate 才能
    # 让 nav2 激活完 —— 这两行就是为了免掉那一步。
    # 值必须与 mm_task/config/mission_real.yaml 的 initial_pose 一致 (都是建图起点,
    # 地面 L 形胶带处 = map 原点)。S0 之后照样会补发同一个值, 幂等不冲突;
    # RViz 的 2D Pose Estimate 也仍随时可覆盖。
    # ⚠️ 代价: "开机前把车推回胶带"从软约定变成硬前提 —— 车不在那儿时 AMCL 会**静默**地
    # 从错位姿起算, 而不是像以前那样卡在 activating 等人。起栈后先看一眼 RViz 里雷达点
    # 与地图墙线对不对得上。
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

