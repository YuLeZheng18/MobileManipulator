# 雷达自遮挡扇区滤除 —— /scan -> /scan_filtered
#
# 车后方被机械臂本体与线材遮挡, 那段测距是"车自己", 不滤掉的后果:
#   建图: 机械臂被建进地图, 成为跟着车走的幽灵墙
#   AMCL: 自遮挡点与地图恒不匹配, 粒子权重被持续污染
#   costmap: 车尾一圈恒定障碍, 局部规划认为自己被堵死, 倒车/原地转全被否
#
# ===== 扇区边界的由来 (2026-08-08 真机实测, 臂在 ready 姿态) =====
# 实测被挡区间是 base_link 160°~180° 跨正后方, 仅约 20~30° 宽:
#   laser_link -10°~0°   (=base 170~180)  恒读 0.155m  结构件
#   laser_link +10°~+20° (=base -170~-160) 无返回, 近于 range_min 0.15 下限
# ⚠️ 零位下反而更宽(约 50°): laser_link +30°~+40° 零位读 0.144m, 臂抬到 ready 后
#    变 1.900m —— 线材离开了扫描面。故本组值按 **ready(行驶姿态)** 标定, 这是对的:
#    抓取时臂展开会挡更多, 但那时车停着不导航。
# 取 ±25° (共 50°) 而非实测的 20~30°: 托盘装满货会变宽, 留近一倍余量。
#    余量是免费的, 装货后重量一次成本高。
# ⚠️ 别砍到 180° —— 那会白扔掉一半扫描点, 而长直货架通道特征本就贫乏, AMCL 会明显更易飘。
#    保留 310° 视野。
#
# ===== 为什么边界写在 laser_link 帧里是 0° 附近 =====
# laser_link 的 0° 指向**车尾**(雷达绕竖轴转 180° 装, 见 mm_robot.urdf 的 Joint_laser),
# 而遮挡恰在车尾 ⇒ 在 scan 自己的角度里遮挡落在 0° 附近, 砍 [-25°, +25°] 是一个
# **不跨 ±pi 的连续区间**。若改用 base_link 方位表达就得写成"跨 ±180 的两段", filter 配不出来。
#
# 用 InPlace 版本: 区间内的点置为 range_max+1 (视作无效) 而**不改变** scan 的
# angle_min/angle_max/长度。好处是下游 costmap/AMCL 拿到的还是一条完整 360° 扫描,
# 不必跟着改任何角度假设; 非 InPlace 版会裁短数组并改写角度范围, 反而容易埋坑。
scan_filter_chain:
  ros__parameters:
    filter1:
      name: self_occlusion_rear
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # 弧度。-25° ~ +25° (判据是严格不等号 > 与 <, 边界那一格本身保留)
        lower_angle: -0.4363323
        upper_angle: 0.4363323
        # ⚠️ 必须 true(填 NaN), 别用默认的 range_max+1:
        # range_max+1 会被下游当"超量程", 而 costmap 的 obstacle layer 对超量程读数可能
        # 沿射线**清空**栅格 —— 那等于宣告"车后方是确认的自由空间", 而真相是
        # "被自己挡住、未知"。NaN 在点云投影时直接丢弃, 既不标障碍也不清空, 保持未知。
        replace_with_nan: true
