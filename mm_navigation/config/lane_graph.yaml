# ===== 方案A: 固定车道图 (真机卧室实测路网, 2026-08-11 改成纯正交方格网) =====
# nodes  : 命名路点, 机器人只能停靠在这些点; yaw 是到位后要对齐的目标朝向(弧度)
# edges  : 直线车道(双向). 路径永远沿这些边走, 不做任意角度重规划.
# 机器人当前位置 -> 投影到最近车道边 -> Dijkstra 到目标 node -> 顶点序列倒圆角
#   -> 加密成 nav_msgs/Path(每点切线朝向) -> follow_path 一次跑完.
#
# ⚠️ 坐标全部对着 maps/room_real.yaml 这张真机图 (origin [-4.34,-1.61], 10.7 x 6.25m).
#
# ===== 本轮改动 (2026-08-11): 田字格(带斜辐条) -> 纯正交方格网 =====
# 用户要求"路网都是方格直角的". 上一版虽然四个 pick 押成了矩形, 但 home 出去的四条辐条
# (home-pick1/pick2) 和两条去放货区的干道 (home-w_nw / home-w_ne) 都是**斜边**.
# 现在全部拆成"先横后纵"的正交折线, **干道上一条斜边都不剩**
# (只有末梢两条进放货点的边留 1.2°/0.3° 微斜, 因为放货点坐标是标定值, 理由见 edges 段注释).
#
# ⚠️ **直角只存在于路网拓扑, 不是车真的走直角.** lane_navigator 的 build_rounded_xy 会按
#    corner_radius 把每个直角顶点倒成圆弧, 全向底盘边平移边缓转连续通过, 拐角不停车.
#    路网存直角 = 让路线可目视核对/可手算; 实际轨迹在拐角是曲线. 两者不矛盾.
#
# 新增 9 个纯几何交点节点(只过路不停):
#   j_e  ( 1.13, 0    ) = home 行 ∩ 东列      j_w  (-0.82, 0    ) = home 行 ∩ 西列
#   c_ne ( 1.13, 0.45 ) = 东列   ∩ 东西廊道   c_nw (-0.82, 0.45 ) = 西列   ∩ 东西廊道
#   c_e  ( 3.04, 0.45 ) = 廊道东端 ∩ w_ne 列  c_w  (-2.61, 0.45 ) = 廊道西端 ∩ w_nw 列
#   j_s  ( 0   ,-0.28 ) = 中央竖线 ∩ 南排     j_n  ( 0   , 0.85 ) = 中央竖线 ∩ 北排
#   c_c  ( 0   , 0.45 ) = 中央竖线 ∩ 东西廊道 = **田字中心**(净距 0.791)
# 删掉 4 条斜边: home-pick1 / home-pick2 (斜辐条) 与 home-w_ne / home-w_nw (斜干道).
# 保留 home-j_e / home-j_w 作 home 出口(它们是纯横边), 到 pick1/pick2 改走"横+纵"两段.
#
# ===== 补齐"田"字的两处缺口 (2026-08-11 第二轮, 用户指出) =====
# 上一版把斜辐条拆成"先横后纵"时省掉了两样东西, 结果图**不成田字**:
#   ① **没有任何南北向的路穿过 home** —— 所有路线都是从 home 横着出去再纵向走.
#      现补中央竖线 x=0: j_s - home - c_c - j_n. 实测 x 从 0 扫到 +0.30 净距恒 0.400
#      (往西到 -0.20 才掉到 0.354) -> x=0 正落在净距平台上, 不用偏.
#   ② **东西廊道 y=0.45 是断开的两截**(西 c_nw-c_w / 东 c_ne-c_e), 中间 1.95m 没连.
#      现补 c_nw - c_c - c_ne 把廊道连通, 这两条边净距 0.750/0.791 是全图最宽的.
# 顺带把两排 pick 横边在竖线处断开(pick2-j_n-pick1 / pick4-j_s-pick3), 交点才成立.
# 收益: 19 节点 / 24 边, place1->place2 由 11.38m 降到 **10.89m**(−0.49m, 走中央竖线抄近).
#
# ===== 东西廊道为什么走 y=0.45 =====
# 用户草图上那两个转角是"旧 home->w_ne / home->w_nw 斜线与 pick 竖列的交点"
# (实测反解 = 东 0.435 / 西 0.396). 但斜线一删, 这两个值就没有几何依据了, 故改取 y=0.45:
#   ① 净距最优: 实测东廊 x∈[1.13,3.04] 在 y=0.45 净距 **0.750m**(y=0.40 是 0.700,
#      y=0.60 掉到 0.667); 西廊 x∈[-0.82,-2.61] 在 y=0.45 是 **0.585m**(全段最大值).
#   ② 东西对称, 一个数管两边.
# ⚠️ **不要让廊道沿 y=0 直接往东西走** —— 那条线上东廊净距只有 0.300m(仅 +4cm 余量,
#    紧贴全图瓶颈), 而抬到 0.45 有 0.750m. 差 45cm, 这是本轮最大的安全收益.
#
# ===== 顺手押正: w_gate 从 x=-2.56 挪到 -2.61 =====
# 原先 w_nw(-2.61,1.26) -> w_gate(-2.56,2.21) 是斜 87°(x 差 5cm), 是图里最后一条斜边.
# 押到同列后它成纯竖边, 且**南北通道净距从 0.300 涨到 0.350(+5cm)** ——
# 全图最紧的那一段反而变宽了; w_gate 节点自身净距也从 0.361 涨到 0.381.
# (实测各档通道净距: x=-2.66 → 0.300 / **-2.61 → 0.350** / -2.56 → 0.300 /
#  -2.51 → 0.250 过不去. -2.61 是这条通道的净距峰值, 不是随手取的.)
#
# ===== 代价: 总里程 +7.8% (81.68 -> 88.06m), 但主任务线大多变短 =====
# 21 条任务点两两路线合计 81.68 -> 88.06m. 直角必然比斜线长, 但分布很不均:
#   **变短**: pick1->place2 −0.78m / pick3->place2 −0.60m / pick2->place1 −0.40m
#             (廊道抬到 0.45 后, 从北侧 pick 去放货区不必再绕回 home)
#   **变长**: place1->place2 +1.40m / pick3->place1 +1.03m / home->place1 +0.75m
# mission_real.yaml 实跑的三条 (pick1->place2->place1) 净变化约 −0.4m, **实际更快**.
#
# ===== 校验口径 =====
# 判据: 精确欧氏距离变换(EDT)算每格净距, 要求节点与整条圆角路径逐点净距 >= robot_radius.
# 跑 `python3 src/docs/scripts/lane_graph_check.py` 全量复核.
# ⚠️ 勘误一: 别按"外包络长方形 footprint"算, 其外接圆 0.3578 是**幽灵角**撑出来的
#    —— 那个长方形的后两角 (-0.30,±0.195) 实际是空的. STL 实测托盘 Link_11 只到 y=±0.11,
#    真外接圆 = sqrt(0.2893^2+0.1106^2) = **0.3097**, 比 0.3578 小 4.8cm.
# ⚠️ 勘误二: 曾用 4 连通 BFS 当净距场, 那给的是曼哈顿距离, 系统性高估最多 28%.
#    现已换精确 EDT. 用 BFS 筛出来的坐标全部偏乐观, 别照旧数据判断.
#
# 实测节点净距(精确 EDT, 单位米, robot_radius=0.26):
#   c_ne 0.814 | c_c 0.791 | c_e 0.765 | c_nw 0.750 | j_w 0.716 | home 0.700
#   j_e 0.650 | c_w 0.585 | place2 0.541 | w_nw 0.495 | w_ne 0.492 | pick1 0.427
#   pick4 0.427 | j_s 0.400 | j_n 0.400 | w_gate 0.381 | pick2 0.350 | pick3 0.350
#   place1 0.350
# 十九个节点净距全部 >= 真外接圆 0.3097 -> **每个节点都能原地自转**(圆形口径下与朝向无关).
#
# ===== ⚠️ 设计不变量: 南北通道段内不得插入路网节点 =====
# w_nw->w_gate 这条通道净距 0.350, 已 >= 真外接圆 0.3097(押正后新腾出的余量),
# 但整条 w_gate->place1 走廊只有 0.300 < 0.3097 -> 车在走廊里**不能自转**, 只能直行穿过.
# 现在走廊两端是 w_gate(0.381) 与 place1(0.350, 靠 hold_yaw 免自转), 中间无节点 -> 成立.
# 以后往这条路加中间路点会直接破掉这条, 加之前先算净距.
#
# ===== corner_radius =====
# 本轮全改直角(90°)后, 倒圆角的切距 T = r/tan(45°) = r, 比原先钝角拐点吃掉更多直线段,
# 但各转角处净距 0.49~0.81 都远大于 r=0.3, 放得下.
# 实测 r=0.2~0.5 全路线最小净距都是 0.300(瓶颈在 w_gate->place1 走廊, 由地形定与 r 无关).
# 故 real_bringup.launch.py 传的 corner_radius: 0.3 继续有效, 不用改.

frame_id: map
point_spacing: 0.05

nodes:
  # ---- 原点 = 建图起点 (地面 L 形胶带标出), 也是方格网的中心 ----
  # 净距 0.700m 全图最开阔, 可任意自转. mission 的 initial_pose (0,0,0) 就是这里.
  home:   { x:  0.00, y:  0.00, yaw: 0.0 }

  # ---- home 行 (y=0) 与东西两列的交点: home 的两个正交出口 ----
  # 只过路不停, yaw 不生效(拐角朝向由圆角切线决定).
  j_e:    { x:  1.13, y:  0.00, yaw: 0.0 }   # 东列 x=+1.13 上
  j_w:    { x: -0.82, y:  0.00, yaw: 0.0 }   # 西列 x=-0.82 上

  # ---- 中央竖线 x=0 (穿过 home 的南北干道) 与三条横线的交点 ----
  # 2026-08-11 补: 上一版只有"从 home 横着出去再纵向走", 中央竖线整根缺失, 图不成田字.
  # 实测 x 从 0 扫到 +0.30 净距恒 0.400(往西到 -0.20 才掉到 0.354) -> 走 x=0 正好.
  j_s:    { x:  0.00, y: -0.28, yaw: 0.0 }   # 竖线 ∩ 南排 pick 行 (净距 0.400)
  c_c:    { x:  0.00, y:  0.45, yaw: 0.0 }   # 竖线 ∩ 东西廊道 (净距 0.791, 田字中心)
  j_n:    { x:  0.00, y:  0.85, yaw: 0.0 }   # 竖线 ∩ 北排 pick 行 (净距 0.400)

  # ---- 取货点 x4 = 东西两列 x 上下各一 (车头朝货架) ----
  # 2026-08-10 押正成正交矩形, 位移 2.9~12.3cm. yaw 不变(货架方向没动).
  # ⚠️ 停靠位一变, 车相对货架的位置就变了, 首次跑 grasp 要确认盒子仍落在机械臂约束盒内.
  pick1:  { x:  1.13, y:  0.85, yaw:  3.14159 }   # 东北, 朝 -x
  pick2:  { x: -0.82, y:  0.85, yaw:  3.14159 }   # 西北, 朝 -x
  pick3:  { x:  1.13, y: -0.28, yaw:  0.0 }       # 东南, 朝 +x
  pick4:  { x: -0.82, y: -0.28, yaw:  0.0 }       # 西南, 朝 +x

  # ---- 东西廊道 y=0.45 的四个交点 (只过路不停, yaw 不生效) ----
  # 廊道高度的选取理由见文件头"东西廊道为什么走 y=0.45".
  c_ne:   { x:  1.13, y:  0.45, yaw: 0.0 }   # 东列 ∩ 廊道 (净距 0.814, 全图最宽节点)
  c_nw:   { x: -0.82, y:  0.45, yaw: 0.0 }   # 西列 ∩ 廊道
  c_e:    { x:  3.04, y:  0.45, yaw: 0.0 }   # 廊道东端 ∩ w_ne 列 -> 折向北去 place2
  c_w:    { x: -2.61, y:  0.45, yaw: 0.0 }   # 廊道西端 ∩ w_nw 列 -> 折向北去 place1

  # ---- 放货区入口 (只过路不停) ----
  w_ne:   { x:  3.04, y:  1.17, yaw: 0.0 }   # place2 通道入口
  w_nw:   { x: -2.61, y:  1.26, yaw: 0.0 }   # 南北通道南口
  w_gate: { x: -2.61, y:  2.21, yaw: 0.0 }   # 南北通道北口 = 东西走廊西端
                                             # (2026-08-11 从 x=-2.56 押到 -2.61 同列,
                                             #  通道由斜 87° 变纯竖边且净距 0.300->0.350)

  # ---- 放货点 1: 走廊尽头 ----
  # 净距 0.350 > 真外接圆 0.3097 (余量 4.0cm) -> 几何上可自转.
  # hold_yaw 仍保留, 但**理由不是"自转会撞"**(那是幽灵角口径下的错误结论), 而是:
  #   ① 4.0cm 余量在 AMCL 实测 5~6cm 落点误差面前不够, 到点乱转是白担风险;
  #   ② 末段本来就是沿东西走廊往西开, 锁成 yaw=pi 后 cspin 落在 final_yaw_tol 内直接跳过,
  #      省掉一次原地自转, 更快也更稳.
  # 1.2 米这个值沿用上一轮(锁定段起点落在东西走廊内, 不伸进南北通道), 无需重推.
  place1: { x: -0.921, y: 2.22, yaw: 3.14159, hold_yaw: 1.2 }

  # ---- 放货点 2: 朝 +y, 路径本来就往北走 ----
  # 净距 0.541 可自转, 且末段行进方向(+y)与目标 yaw(+pi/2)天然一致 -> cspin 本来就不用转.
  place2: { x:  3.07, y:  2.63, yaw: 1.5708 }

# 24 条边, 其中 **22 条严格正交**(纯横 H / 纯竖 V), 括号里是边上最小净距(精确 EDT),
# 全部 >= robot_radius 0.26.
#
# ===== ⚠️ 末梢两条刻意留成"微斜", 别去押正 =====
#   w_ne(3.04,1.17) -> place2(3.07,2.63)   dx=3cm / 1.46m -> 偏 1.2°
#   w_gate(-2.61,2.21) -> place1(-0.921,2.22) dy=1cm / 1.69m -> 偏 0.3°
# **place1/place2 是标定过的真实停靠位**(commit 6cb5eaf), 决定车停好后托盘落在机械臂约束盒
# 的哪个位置。押正要动它们的 x/y 各 1~3cm, 而 1~3cm 在约束盒尺度上不是可忽略量
# ⇒ 押正就得重标 unload 的可达性, 拿不到任何回报。
# 这两条偏差对**净距/规划/倒圆角一概没影响**(1.2° 与 0.3° 的切向差, 圆角算法照常吃):
# 押正实测 place2 节点净距 0.541->0.570(略好), place1 不变 —— 收益纯属账面。
# 结论: 方格网是**拓扑口径**, 落到标定过的物理停靠位允许亚度级偏差。
edges:
  # ---- home 行 (y=0): home 的东西两个出口 ----
  - [home, j_e]      # H 1.13m (0.650)
  - [home, j_w]      # H 0.82m (0.700)

  # ---- 中央竖线 x=0 (自南向北): j_s - home - c_c - j_n ----
  # home 的南北两个出口, 补上这三条图才闭成田字.
  - [home, j_s]      # V 0.28m (0.400)
  - [home, c_c]      # V 0.45m (0.700)
  - [c_c, j_n]       # V 0.40m (0.400)

  # ---- 东列 x=+1.13 (自南向北): pick3 - j_e - c_ne - pick1 ----
  - [j_e, pick3]     # V 0.28m (0.350)
  - [j_e, c_ne]      # V 0.45m (0.650)
  - [c_ne, pick1]    # V 0.40m (0.427)

  # ---- 西列 x=-0.82 (自南向北): pick4 - j_w - c_nw - pick2 ----
  - [j_w, pick4]     # V 0.28m (0.427)
  - [j_w, c_nw]      # V 0.45m (0.716)
  - [c_nw, pick2]    # V 0.40m (0.350)

  # ---- pick 横边: 同排两点相连, 在中央竖线处断开成两段 ----
  # (原先是 pick2-pick1 / pick4-pick3 各一整条; 现在中间插了 j_n/j_s 交点)
  - [pick2, j_n]     # H 0.82m (0.350)  北排西半
  - [j_n, pick1]     # H 1.13m (0.400)  北排东半
  - [pick4, j_s]     # H 0.82m (0.400)  南排西半
  - [j_s, pick3]     # H 1.13m (0.350)  南排东半

  # ---- 东西廊道 y=0.45: 中段 c_nw - c_c - c_ne 把东西两截连通 ----
  # 上一版廊道是断开的两截(西 c_nw-c_w / 东 c_ne-c_e), 中间 1.95m 没连.
  - [c_nw, c_c]      # H 0.82m (0.750)
  - [c_c, c_ne]      # H 1.13m (0.791)  <- 全图最宽的边

  # ---- 东西廊道 y=0.45 + 去 place2: c_ne -> c_e -> w_ne -> place2 ----
  - [c_ne, c_e]      # H 1.91m (0.750)
  - [c_e, w_ne]      # V 0.72m (0.492)
  - [w_ne, place2]   # ~V 1.46m (0.427)  <- 微斜 1.2°, 见上方警告

  # ---- 东西廊道 y=0.45 + 去 place1: c_nw -> c_w -> w_nw -> w_gate -> place1 ----
  - [c_nw, c_w]      # H 1.79m (0.585)
  - [c_w, w_nw]      # V 0.81m (0.495)
  - [w_nw, w_gate]   # V 0.95m (0.350)  <- 南北通道, 押正后由 0.300 涨到 0.350
  - [w_gate, place1] # ~H 1.69m (0.300)  <- 全图瓶颈, 走廊内禁止加节点; 微斜 0.3°
