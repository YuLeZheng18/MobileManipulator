# ===== 命名路点表 (真机卧室实测坐标) =====
# 2026-08-11 起本文件**只有 nodes 段还在起作用**: lane_navigator 拿它当"名字 -> 目标位姿"
# 的查找表, 路线由 planner_server 读 costmap 现规划 (见 lane_navigator.py 文件头)。
#   nodes  : 命名路点。x/y = map 系坐标, yaw = 到位后要对齐的目标朝向(弧度)。
#   edges  : ⚠️ **已停用**, 代码不再读。留着只为存档旧路网拓扑 / 人工核对可达性,
#            改它对机器人行为没有任何影响。
#   point_spacing / corner_radius 相关字段也随倒圆角一起废弃。
#
# ⚠️ 坐标全部对着 maps/room_real.yaml 这张真机图 (origin [-4.34,-1.61], 10.7 x 6.25m).
#
# ===== 为什么不再用固定车道 =====
# 旧方案把全场押成纯正交方格网, 于是任何 A->B 都被拆成一串 90° 直角, 每个直角都得停下
# 转头; 而且人工押的车道中线与真实空隙的中线并不重合, 窄处(去 place1 的走廊)常年贴着
# 代价墙走 -> 车走走停停。用户判定不流畅, 遂改成让规划器自己找路。
#
# ===== 2026-08-11 取货点位移 (用户实机要求) =====
#   pick1 / pick2:  y 0.85 -> 0.65   (往**南** 20cm)
#   pick3 / pick4:  y -0.28 -> -0.18 (往**北** 10cm)
# (+y = 北, -y = 南; yaw 不变, 货架方向没动。)
# 用户明确"抓取不用验证", 故未复核盒子是否仍落在机械臂约束盒内 —— 首次跑 grasp 若够不到,
# 先怀疑这里。
#
# ===== 节点净距参考 (精确欧氏距离变换 EDT, 单位米) =====
# 判据是"节点处能不能原地自转": 要求净距 >= 车真外接圆 0.3097
# (STL 实测托盘 Link_11 只到 y=±0.11, 不是旧注释里那个被幽灵角撑出来的 0.3578)。
# 下表是**移点之前**测的, pick1~pick4 挪位后未重测:
#   c_ne 0.814 | c_c 0.791 | c_e 0.765 | c_nw 0.750 | j_w 0.716 | home 0.700
#   j_e 0.650 | c_w 0.585 | place2 0.541 | w_nw 0.495 | w_ne 0.492 | pick1 0.427
#   pick4 0.427 | j_s 0.400 | j_n 0.400 | w_gate 0.381 | pick2 0.350 | pick3 0.350
#   place1 0.350
# 全图瓶颈仍是 w_gate -> place1 那条东西走廊, 净距 0.300m。robot_radius 已从 0.26 降到
# 0.22 (nav2_params.yaml), 走廊里可用中线带宽由 4cm 涨到 16cm —— 这就是"让车敢过点"。
# 复核工具: `python3 src/docs/scripts/lane_graph_check.py` (它仍按旧的车道+圆角口径算,
# 现在只能当"节点净距"参考, 路径部分的结论已不适用)。

frame_id: map
point_spacing: 0.05

nodes:
  # ---- 原点 = 建图起点 (地面 L 形胶带标出), 也是方格网的中心 ----
  # 净距 0.700m 全图最开阔, 可任意自转. mission 的 initial_pose (0,0,0) 就是这里.
  home:   { x:  0.00, y:  0.00, yaw: 0.0 }

  # ---- home 行 (y=0) 与东西两列的交点: home 的两个正交出口 ----
  # 只过路不停, yaw 不生效(拐角朝向由圆角切线决定).
  j_e:    { x:  1.13, y:  0.00, yaw: 0.0 }   # 东列 x=+1.13 上
  j_w:    { x: -0.82, y:  0.00, yaw: 0.0 }   # 西列 x=-0.82 上

  # ---- 中央竖线 x=0 (穿过 home 的南北干道) 与三条横线的交点 ----
  # 2026-08-11 补: 上一版只有"从 home 横着出去再纵向走", 中央竖线整根缺失, 图不成田字.
  # 实测 x 从 0 扫到 +0.30 净距恒 0.400(往西到 -0.20 才掉到 0.354) -> 走 x=0 正好.
  j_s:    { x:  0.00, y: -0.28, yaw: 0.0 }   # 竖线 ∩ 南排 pick 行 (净距 0.400)
  c_c:    { x:  0.00, y:  0.45, yaw: 0.0 }   # 竖线 ∩ 东西廊道 (净距 0.791, 田字中心)
  j_n:    { x:  0.00, y:  0.85, yaw: 0.0 }   # 竖线 ∩ 北排 pick 行 (净距 0.400)

  # ---- 取货点 x4 = 东西两列 x 上下各一 (车头朝货架) ----
  # 2026-08-10 押正成正交矩形, 位移 2.9~12.3cm. yaw 不变(货架方向没动).
  # ⚠️ 停靠位一变, 车相对货架的位置就变了, 首次跑 grasp 要确认盒子仍落在机械臂约束盒内.
  pick1:  { x:  1.13, y:  0.65, yaw:  3.14159 }   # 东北, 朝 -x  (2026-08-11 南移 20cm)
  pick2:  { x: -0.82, y:  0.65, yaw:  3.14159 }   # 西北, 朝 -x  (2026-08-11 南移 20cm)
  pick3:  { x:  1.13, y: -0.18, yaw:  0.0 }       # 东南, 朝 +x  (2026-08-11 北移 10cm)
  pick4:  { x: -0.82, y: -0.18, yaw:  0.0 }       # 西南, 朝 +x  (2026-08-11 北移 10cm)

  # ---- 东西廊道 y=0.45 的四个交点 (只过路不停, yaw 不生效) ----
  # 廊道高度的选取理由见文件头"东西廊道为什么走 y=0.45".
  c_ne:   { x:  1.13, y:  0.45, yaw: 0.0 }   # 东列 ∩ 廊道 (净距 0.814, 全图最宽节点)
  c_nw:   { x: -0.82, y:  0.45, yaw: 0.0 }   # 西列 ∩ 廊道
  c_e:    { x:  3.04, y:  0.45, yaw: 0.0 }   # 廊道东端 ∩ w_ne 列 -> 折向北去 place2
  c_w:    { x: -2.61, y:  0.45, yaw: 0.0 }   # 廊道西端 ∩ w_nw 列 -> 折向北去 place1

  # ---- 放货区入口 (只过路不停) ----
  w_ne:   { x:  3.04, y:  1.17, yaw: 0.0 }   # place2 通道入口
  w_nw:   { x: -2.61, y:  1.26, yaw: 0.0 }   # 南北通道南口
  w_gate: { x: -2.61, y:  2.21, yaw: 0.0 }   # 南北通道北口 = 东西走廊西端
                                             # (2026-08-11 从 x=-2.56 押到 -2.61 同列,
                                             #  通道由斜 87° 变纯竖边且净距 0.300->0.350)

  # ---- 放货点 1: 走廊尽头 ----
  # 净距 0.350 > 真外接圆 0.3097 (余量 4.0cm) -> 几何上可自转.
  # hold_yaw 仍保留, 但**理由不是"自转会撞"**(那是幽灵角口径下的错误结论), 而是:
  #   ① 4.0cm 余量在 AMCL 实测 5~6cm 落点误差面前不够, 到点乱转是白担风险;
  #   ② 末段本来就是沿东西走廊往西开, 锁成 yaw=pi 后 cspin 落在 final_yaw_tol 内直接跳过,
  #      省掉一次原地自转, 更快也更稳.
  # 1.2 米这个值沿用上一轮(锁定段起点落在东西走廊内, 不伸进南北通道), 无需重推.
  place1: { x: -0.921, y: 2.22, yaw: 3.14159, hold_yaw: 1.2 }

  # ---- 放货点 2: 朝 +y, 路径本来就往北走 ----
  # 净距 0.541 可自转, 且末段行进方向(+y)与目标 yaw(+pi/2)天然一致 -> cspin 本来就不用转.
  place2: { x:  3.07, y:  2.63, yaw: 1.5708 }

# ===== ⚠️ 以下 edges 段代码已不再读取 (2026-08-11 去路网), 纯存档 =====
# 保留理由: 这 24 条边是当年用 EDT 一条条量出来的"哪条走廊过得去", 括号里的净距是现场
# 实测值, 判断某个区域能不能走时还查得上。改它对机器人行为**没有任何影响**。
# (pick1~pick4 已南/北移, 与之相连的边长度注释因此过时, 不再维护。)
#
# 24 条边, 其中 **22 条严格正交**(纯横 H / 纯竖 V), 括号里是边上最小净距(精确 EDT).
#
# ===== ⚠️ 末梢两条刻意留成"微斜", 别去押正 =====
#   w_ne(3.04,1.17) -> place2(3.07,2.63)   dx=3cm / 1.46m -> 偏 1.2°
#   w_gate(-2.61,2.21) -> place1(-0.921,2.22) dy=1cm / 1.69m -> 偏 0.3°
# **place1/place2 是标定过的真实停靠位**(commit 6cb5eaf), 决定车停好后托盘落在机械臂约束盒
# 的哪个位置。押正要动它们的 x/y 各 1~3cm, 而 1~3cm 在约束盒尺度上不是可忽略量
# ⇒ 押正就得重标 unload 的可达性, 拿不到任何回报。
# 这两条偏差对**净距/规划/倒圆角一概没影响**(1.2° 与 0.3° 的切向差, 圆角算法照常吃):
# 押正实测 place2 节点净距 0.541->0.570(略好), place1 不变 —— 收益纯属账面。
# 结论: 方格网是**拓扑口径**, 落到标定过的物理停靠位允许亚度级偏差。
edges:
  # ---- home 行 (y=0): home 的东西两个出口 ----
  - [home, j_e]      # H 1.13m (0.650)
  - [home, j_w]      # H 0.82m (0.700)

  # ---- 中央竖线 x=0 (自南向北): j_s - home - c_c - j_n ----
  # home 的南北两个出口, 补上这三条图才闭成田字.
  - [home, j_s]      # V 0.28m (0.400)
  - [home, c_c]      # V 0.45m (0.700)
  - [c_c, j_n]       # V 0.40m (0.400)

  # ---- 东列 x=+1.13 (自南向北): pick3 - j_e - c_ne - pick1 ----
  - [j_e, pick3]     # V 0.28m (0.350)
  - [j_e, c_ne]      # V 0.45m (0.650)
  - [c_ne, pick1]    # V 0.40m (0.427)

  # ---- 西列 x=-0.82 (自南向北): pick4 - j_w - c_nw - pick2 ----
  - [j_w, pick4]     # V 0.28m (0.427)
  - [j_w, c_nw]      # V 0.45m (0.716)
  - [c_nw, pick2]    # V 0.40m (0.350)

  # ---- pick 横边: 同排两点相连, 在中央竖线处断开成两段 ----
  # (原先是 pick2-pick1 / pick4-pick3 各一整条; 现在中间插了 j_n/j_s 交点)
  - [pick2, j_n]     # H 0.82m (0.350)  北排西半
  - [j_n, pick1]     # H 1.13m (0.400)  北排东半
  - [pick4, j_s]     # H 0.82m (0.400)  南排西半
  - [j_s, pick3]     # H 1.13m (0.350)  南排东半

  # ---- 东西廊道 y=0.45: 中段 c_nw - c_c - c_ne 把东西两截连通 ----
  # 上一版廊道是断开的两截(西 c_nw-c_w / 东 c_ne-c_e), 中间 1.95m 没连.
  - [c_nw, c_c]      # H 0.82m (0.750)
  - [c_c, c_ne]      # H 1.13m (0.791)  <- 全图最宽的边

  # ---- 东西廊道 y=0.45 + 去 place2: c_ne -> c_e -> w_ne -> place2 ----
  - [c_ne, c_e]      # H 1.91m (0.750)
  - [c_e, w_ne]      # V 0.72m (0.492)
  - [w_ne, place2]   # ~V 1.46m (0.427)  <- 微斜 1.2°, 见上方警告

  # ---- 东西廊道 y=0.45 + 去 place1: c_nw -> c_w -> w_nw -> w_gate -> place1 ----
  - [c_nw, c_w]      # H 1.79m (0.585)
  - [c_w, w_nw]      # V 0.81m (0.495)
  - [w_nw, w_gate]   # V 0.95m (0.350)  <- 南北通道, 押正后由 0.300 涨到 0.350
  - [w_gate, place1] # ~H 1.69m (0.300)  <- 全图瓶颈, 走廊内禁止加节点; 微斜 0.3°
