grasp_node:
  ros__parameters:
    # ============================================================
    #  双托盘放置 + 按类别堆叠 (真机标定值, base_link 系)
    #  release z = 托盘"空载吸盘接触中心"标定 z + 累计下层厚度 + 本层厚度
    #  厚度来源: fallback_thickness 实测标定值 (视觉厚度当前仅打印对照, 见下方注释).
    # ============================================================

    num_trays: 2                    # 托盘数. 数组参数长度须与此一致.

    # 托盘"空载吸盘接触托盘中心"位姿 (真机 RViz/实测标定). 索引 0=右托盘, 1=左托盘.
    #   xyz = suction_tip 空载贴托盘中心时的位置; quat = 工具朝下的标定朝向(非单位姿态).
    #   放置时: 规划到此 xy+朝向的正上方 -> 笛卡尔垂直直下到 release z(见上式) -> 释放.
    # 2026-07-30 两盘各往 base -x 方向(车后)移 5mm (原 -0.235): 实跑落点整体偏前, 往后挪居中.
    tray_x:  [-0.240, -0.240]
    # 托盘1 的 y 2026-07-28 实跑后左移 5mm (原 -0.062): 落点整体偏托盘右侧, 往左挪居中.
    # 只动托盘1 —— 托盘0 那条路径还没实跑过, 它的标定值独立, 不跟着这份观测挪.
    # 2026-07-29 二次调整: 再右移 5mm 回 -0.062 (实跑落点偏左, 往右挪居中).
    tray_y:  [ 0.047, -0.062]
    # 2026-07-28 真机实跑后各抬 1cm (原 0.079/0.081): 按原值放置时盒底压到托盘面偏低,
    # 抬 1cm 让盒子松松落进去而不是被压着塞. 这是标定基准, 所有层的释放 z 一起抬.
    # (同日试过再降 5mm 到 0.084/0.086, 实跑后仍取回 1cm 这版.)
    tray_z:  [ 0.089,  0.091]
    # 2026-07-29 两盘朝向各左旋(绕 base z 逆时针) 5°: yaw 180° -> -175°.
    # 值 = q_z(+5°) * 原 q, 已归一化. 两盘同旋, 因为两盘 q 本来相同.
    tray_qx: [ 0.008991,  0.008991]
    tray_qy: [ 0.000393,  0.000393]
    tray_qz: [ 0.999048,  0.999048]
    tray_qw: [-0.043619, -0.043619]

    tray_capacity: [2, 2]           # 每托盘最多摞几个盒 (满了拒绝再放, 防撞).

    # ---- 类别 -> 托盘映射 ----
    # category_ids[i] 类别的盒子放到 category_tray[i] 号托盘 (0=右,1=左).
    # 用户确认: 类别1,2 -> 左托盘(索引1); 类别3,4 -> 右托盘(索引0).
    category_ids:   [1, 2, 3, 4]
    category_tray:  [1, 1, 0, 0]

    # 各类别盒子厚度 (米), 按 category_ids 顺序, 真机卡尺实测值.
    # release_z 只用这里的值算. 视觉 /perception/object_thickness 仅打印对照不采信:
    # 其 table 深度取自 OBB 向内收缩的 ROI, 窗口内全是盒顶(实测深度散布仅 6~10mm),
    # table-d 恒在 3mm 量级. 视觉厚度可信后再改 grasp_node::currentThickness.
    # 类别1 的 0.022: 2026-07-26 实测反推. 按 0.028 算出的行程下插到位吸不上, 手动再补插
    # 5mm 才吸住; 吸住瞬间 TCP z=-0.0255, 地面常量 -0.0476 -> 真实盒顶离地 22.1mm.
    # 类别3 的 0.017->0.012: 2026-07-28 实跑后类别3 盒按 17mm 算行程下插差 5mm 吸不上
    #   (盒顶实际比算出的低 5mm, 即真实盒高 ~12mm). 厚度=盒顶离地高, 调小则③多插 5mm,
    #   放置释放高度也同步降 5mm(盒底照样落托盘面), 吸/放两头一起对.
    # 类别4 的 0.017->0.015: 2026-07-29 实跑吸不上, 需③多插 -> 调小 2mm.
    #   (同日曾误调大到 0.020 想"少插", 方向反了: 厚度是盒顶离地高, 调大=盒顶更高=插更浅.)
    fallback_thickness: [0.022, 0.024, 0.012, 0.015]

    # 携盒高空 transit 航点 z (绝对, base_link 系): 放托盘时先 plan 到此高度再垂直直下.
    # 2026-07-29 替代原"plan 到 target.z+tray_clearance_ 低空": 那版在别盘有已放盒时
    # 规划会被 placed_t 盒挡到 abort. 改成 plan 到高空, 两端都在自由空间, 失败率≈0.
    # 2026-07-29 二次调整: 0.30 在场景干净时跑通, 但同日发现 0.18/0.25 失败的根因是
    # reset_stack 没清掉的残留 placed_t1_l1 碰撞体, 不是高度不够. 修了 reset_stack 兜底
    # 直发 REMOVE 后, 降回 0.20 折中: 起点盒底 ~0.178, 围栏顶 ~0.120, 间隙 5.8cm 直下无遮挡.
    # 2026-07-30: 0.20 -> 0.26. 两盘都摞到第 2 层后放第四个盒, plan 到 transit 被 abort:
    #   "Invalid states at index [39] out of 65", 接触对 placed_t1_l2 <-> carried_box.
    # 即携盒从右前飞到左后托盘时, 路径贴着**别盘**那摞 2 层盒的顶过. 0.20 下携盒底 ~0.188、
    # 左盘 2 层顶 ~0.137, 名义间隙 5cm, 但 RRTConnect 采样能钻进去 —— 且碰撞是在 pipeline
    # 之后的 postprocessing 加密插值时才暴露, setNumPlanningAttempts(10) 不会重试, 直接 abort.
    # 抬到 0.26 让采样空间整体上移. 前三轮没暴露是因为两盘各只有 1 层, 通道够宽.
    transit_z: 0.26

    # ---- ① 取 object_pose 前的管线排空 + 一致性门 (2026-07-29 加) ----
    # 症状: ① 粗定位开偏 12~16cm, ② 精修被迫从 118~146mm 往回爬, 前几步全被
    # refine_max_step(40mm) 截断, 6 步用尽仍差最后一步就收敛(第四轮实测).
    # 根因之二(之一是感知侧单目标选中托盘已放盒, 已由 yolo 的 pick_z_max 修): 原先 look
    # 一返回就抓第一帧新鲜 object_pose, 而相机曝光到 NCNN 出框有一整段延迟, 摆臂刚停那刻
    # 管线里积压的仍是运动中拍的画面, 感知端却用**当前** TF 把它转到 base_link ——
    # 图像姿态与 TF 姿态错配, 坐标整体偏掉.
    # 2026-07-29 实测(look 位, 盒静止): 摆臂中连续帧报 (-0.199,-0.257) -> (-0.207,-0.252)
    # -> (-0.220,-0.245) -> (-0.249,-0.227) 一路滑 5cm; 停稳后稳定在 (-0.035,-0.351),
    # 连续帧位数全同. 与 axis_flush_sec 治 θ_img 的是同一个问题、同一套办法.
    # 时间戳是接收时刻不是曝光时刻, 判不出某帧拍于何时, 只能按延迟上界等过去(flush),
    # 再用帧间一致性做真判据(运动中的帧彼此在滑, 静止帧重合).
    # 2026-07-30: 0.3 -> 0.0 (去掉这段等待). 排空的动机是"管线里积压的是运动中拍的画面,
    # 而感知端用当前 TF 把它转到 base_link -> 图像姿态与 TF 姿态错配, 坐标整体偏掉".
    # 感知侧现已按**图像自己的时间戳**查 TF (yolo 的 tf_wait_sec + MultiThreadedExecutor),
    # 陈旧帧配的是同时刻的 TF, 给出的坐标照样正确 —— 错配从根上没了, 不用再等它过去.
    # 实测(2026-07-30 对齐后): 臂运动中静止盒子连续 30 帧 base_link 完全相同, 此前同一段滑 21cm.
    # 下面的帧间一致性门(object_consist_frames/tol)保留, 它是真判据, 不依赖这个等待.
    # ⚠️ 注意别顺手把 axis_flush_sec 也清零: θ_img 是纯图像角、压根不过 TF, 时刻对齐修不到它,
    # 转腕途中拍的帧反映的是另一个腕角, 那个等待仍然必需.
    object_flush_sec: 0.0           # 采样前先丢弃这么多秒内到的帧(排空管线); 0=不等
    object_consist_frames: 3        # 连采几帧比一致性 (检测 ~11Hz, 3 帧约 0.3s)
    object_consist_tol: 0.010       # 帧间散布上限(米). 实测运动中每帧滑 ~8mm, 静止 ~0mm
    object_resample_tries: 4        # 不一致时最多重采几次, 全败才中止(此刻未吸盒, 安全)

    # 调试开关: pick_skip_insert=true 时 /grasp/pick_only 跑完 ①+②+对齐 yaw 后停住,
    # 跳过 ③下插. 用于验精修对准效果. 验完改回 false (或注释掉) 重启.
    pick_skip_insert: false

    # 放置开阀释放时长(秒), 默认 3.0. 用户要 1.0(3s 太久). 刻意不在此声明:
    # 代码 line 112 用普通 declare_parameter(非 getOrDeclare), 与 automatically_declare
    # _from_overrides 二次声明冲突会崩(2026-07-28 实证 exit -6). 用 launch/-p 或运行时
    #   ros2 param set /grasp_node release_duration 1.0
    # 覆盖. 要写死默认为 1.0 得改 line 112 的默认值(重编).

    # 释放开阀时长(秒): 开阀破真空这么久后立刻关阀(电磁阀持续通电会发烫, 见 releasePulse).
    # 2026-07-28 真机实跑后从 3.0 降到 1.0: 破负压只需几百 ms, 3s 纯等待拖慢节拍(用户实测反馈).
    # 注: releasePulse 读的是启动缓存的成员变量, 改这里须重启 grasp_node 才生效(ros2 param set 不热更).
    release_duration: 1.0

    # ③ 下插行程少走这么多米(负值=多插). 行程 = TCP z - 盒顶 z - 这个值, 盒顶 z 由
    # ground_z + 该类别 fallback_thickness 算出. 单独一个参数而不是改 thickness:
    # thickness 还要算托盘释放高度(tray_z + 累计 + 本层), 动它会把堆叠高度一起算错.
    # 2026-07-28: +0.002 -> -0.001 (多插 3mm), 按 +2mm 下到位时吸盘离盒顶仍有可见空隙.
    # 2026-07-30: -0.001 -> -0.006 (再多插 5mm). 类别 2 盒(厚 24mm)实跑 147.5mm 行程
    # 下到位后没吸住. ground_z 与厚度这组标定值当初靠"吸住瞬间 TCP z"同一组数反推,
    # 彼此自洽但都不独立, 合起来把盒顶估高了几 mm; 用负值压过去, 多压的量靠吸盘海绵吃掉.
    # 注: 启动时读进成员变量, ros2 param set 不热更(节点无 on_set_parameters_callback),
    # 改这里必须重启 grasp_node.
    insert_shortfall: -0.006

    # ---- 四步渐进安全测试开关 (Task #1) ----
    # 刻意不在此声明 dry_run / place_velocity_scaling: 具名节点条目("grasp_node")
    # 优先级高于 launch 传的通配条目和 -p, 写在这里会把命令行值压掉, 开关静默失效.
    # 默认值由 grasp_node.cpp 的 getOrDeclare 兜底 (dry_run=false, scaling=1.0),
    # 测试时用 launch 参数覆盖:
    #   ros2 launch mm_grasp grasp.launch.py dry_run:=true
    #   ros2 launch mm_grasp grasp.launch.py place_velocity_scaling:=0.1

    # ---- 类别+厚度话题 (B 路线, Task #4) ----
    # 队友视觉侧额外发的轻量话题: 当前目标盒的 类别(int) + 厚度(米,float).
    # 话题名/字段形式与队友对齐后改这里; 收不到则 execute 用 default_category 兜底.
    class_topic: /perception/object_class        # std_msgs/Int32: 当前目标类别
    thickness_topic: /perception/object_thickness # std_msgs/Float32: 当前目标厚度(米)
    default_category: 1                            # 收不到类别时按此类别放 (兜底)

    # ---- ② 精修: 相机系闭环对准 (不过手眼标定) ----
    # 精修误差在相机系算: 盒心 p_cam 的横向 (y,z) 追标定目标值 cam_target_y/z.
    # 为什么不用 base_link 坐标: 手眼标定误差(机械安装误差 + 增量式零位与 URDF 零位不一致)
    # 让检测出的 base_link 坐标偏 2~3cm, 且随臂构型变 —— 闭环追它会变成"臂动->偏差变->
    # 目标跑"的追逐(实测 20s 不收敛). p_cam 只过深度与相机内参, 臂动它不跳.
    cam_point_topic: /perception/object_point_cam   # geometry_msgs/PointStamped, frame=Link_30
    cam_frame: Link_30              # 相机机械系; 精修只借它的旋转把误差方向转到 base_link

    # 横向是 (y,z) 不是 (x,y): Link_30 机械系 x 是光轴 —— 实测 p_cam.x 恒等于深度值.
    # 标定方法: 臂开到盒上方 pregrasp_height(12cm), 人工把吸盘对准盒心, 调
    #   ros2 service call /grasp/calib_cam_target std_srvs/srv/Trigger
    # 读回的 (y,z) 就是目标值, 填到这里. 标定高度须与工作高度一致(都是 12cm).
    #
    # 彩色内参坏(camera_info K=NaN, 现用 fallback 粗估)不影响这里: 像素->深度像素换算的
    # 内参误差是仿射的(测得 = k*真值 + b), 标定目标值与实测值同走这条链路, 闭环做差时
    # k 和 b 精确抵消. 反投影本身用的是有效的深度(红外)内参.
    # (注: yaw 不在此列 —— 它另有手眼外参旋转的问题, 见文件末尾"吸盘朝向对齐"一节.)
    # 2026-07-29 二次重标 (验精修对准): ②收敛后(5.3mm,θ_img -0.6°)目视仍偏, 用 /grasp/jog
    #   手动 base -y 7mm + yaw +3° (序列 -2 -5 +1 +1 +5 -4 mm/°) 调到目视对齐, 读此值.
    #   y -0.04221 / z 0.03233 / yaw 0.8°. 比 07-29 首标 (y -0.03895 / z 0.03725 / yaw -0.1°)
    #   y 再偏 -3.3mm, z 偏 -4.9mm, yaw +0.9° —— 07-29 首标时目视判"对齐"偏松, 二次更严.
    # 2026-07-29 重标: 上 pregrasp 12cm 人工对准盒心后纯竖直下插 6cm 再抬回 12cm 读得
    #   (流程同 07-28). y -0.03895 与 07-28 值 -0.0391 基本一致; z 0.03725 比 07-28 的
    #   0.0314 抬高 5.85mm —— 当天盒子摆位/对准手感差异, 取本次实测.
    # 2026-07-28 重标: 吸盘下插 6cm(12cm 目测不准)人工对准盒心后纯竖直抬回 12cm 读得,
    #   四次读值 y∈[-0.0393,-0.0389] z=0.0314 稳定, 取 y 均值 -0.0391. (旧值 -0.0358/0.0303.)
    # 2026-07-26 首标: 人工把盒子推到吸盘正下方对准, 在 pregrasp 12cm 高度读得.
    # 此刻 TCP base_link=[-0.155,-0.302,0.125], 检测报盒心 base_link=[-0.175,-0.325] ——
    # 眼睛看着对准, base_link 却差 30mm, 这 30mm 就是手眼标定偏差. 正因如此才用相机系:
    # 目标值记的是"对准时相机看到什么", base_link 偏多少都不进闭环.
    cam_target_y: -0.04221
    cam_target_z: 0.03233

    cam_tol: 0.003                  # 相机系横向误差收敛阈值(米). 2026-07-29 从 6mm 收紧到 3mm (5mm 目视偏松)
    # 注: 误差方向 -> base_link 位移的映射不是标定死的符号表, 而是每轮精修开头用两次
    # probe_step 试探实测出 2x2 雅可比, 无论中间差多少次旋转/反射都被实测吸收.

    # ---- 吸盘朝向对齐: 闭环追长轴图像角 θ_img ----
    # 抓取要的是"吸盘长轴与盒长轴共线", 否则盒斜贴在吸盘上, 放进带围栏的托盘会蹭卡.
    #
    # 为什么不用 object_pose 里的 base_link 系盒 yaw: 那个 yaw = R @ (相机系长轴),
    # R(base_link<-Link_30) = FK(6关节) ∘ 手眼外参. 臂是增量式编码器、上电即零位、零位靠
    # 手摆(重复性约 1cm), 于是旋转误差经 FK 进来, 且随构型变 —— 与当初逼着 ② 精修改用
    # 相机系坐标的是同一个根因. 2026-07-27 实测: 检测报盒 +36.2°(腕在 coarse_yaw -90°),
    # 按它转到腕 -143.7° 后, 人工再补转 6° 到 -149.7° 才与盒边贴合. 只重标 Link_29->Link_30
    # 也治不了: 误差主体在 FK/零位那一侧, 不在这段外参里.
    #
    # 绕过办法: 相机固连腕(Link_30 挂 Link_29), 所以"吸盘长轴在图像里占多少度"是与构型
    # 无关的常数 θ_img*. 盒长轴与吸盘长轴平行 <=> θ_img == θ_img*, 于是对齐是个能在机上
    # 直接看到的**终点判据**, 腕该转多少不需要事先知道 —— 闭环转腕直到 θ_img 落进容差.
    #
    # ⚠️ 2026-07-28 推翻了前一版的"解算式" ψ = ψ_ref + s·k·(θ_ref − θ_img):
    # 它假设 ψ→θ_img 是常斜率, 而三个人工贴合点否掉了这个假设 ——
    #   θ_img −37.6° ↔ ψ −149.7° | θ_img +48.0° ↔ ψ −48.7° | θ_img −66.5° ↔ ψ −20.3°
    #   前两点给 k=1.18; 第一与第三点需要 k=1.75(即便允许 90°/180° 等价折叠仍差 16.5°).
    # 腕绕 base z 转而光轴不与 base z 平行, 投影把关系压成随 ψ 变化的畸变, 单个增益覆盖不了
    # 量程: 正侧(k=1.18)调准后负侧实测过冲 20° 以上. 闭环把增益降级成"步长估计"(偏 20%
    # 只是多迭代一步), 终点精度只由 θ_img* 与容差决定.
    # 顺带消掉旧链最恶心的性质: 偏差随"离标定点角距离"放大, 使得在标定点附近试必然误判为
    # "已修好" —— 2026-07-27 因此踩了四轮(离 1.7° 时偏 0.2° 目视完全对齐, 离 85° 时偏 6~8°).
    #
    # 标定方法(只需这一个常数): 臂开到盒上方 pregrasp 高度(/grasp/coarse_only), 手动转腕
    # 直到吸盘长轴与盒边贴合(相机不能被吸盘挡住, 别把吸盘压在盒上), 然后
    #   ros2 service call /grasp/calib_yaw_ref std_srvs/srv/Trigger
    # 读回的 θ_img 就是下面这个值. 2026-07-29 二次重标: jog yaw +3° 后目视对齐读得 0.8°
    #   (07-29 首标 -0.1°, 07-28 标定 -0.1°). 首标目视判对齐偏松, 二次严标到 0.8°.
    yaw_target_theta_img: 0.8      # 吸盘长轴自身的图像角(度) = 贴合判据
    yaw_align_tol_deg: 1.0          # 收敛容差(度). 2026-07-29 从 2.0 收紧到 1.0 (二次重标后噪声可控)

    # ---- 步长: 先验斜率打头, 每步重采闭环修正 (2026-07-28 改) ----
    # 原先用固定 sign=+1 gain=1.11 一次开环解算就下发. 实测斜率随角区在 0.5~0.9 间变
    # (θ_img +41.5° 处 +0.86, -39.8° 处 +0.48), 单次开环偏 40% 就是几十度, 直接把腕甩过
    # (-90,90] 折叠边界. 故改成每步转完重采 θ_img 闭环修正 —— 与 ② 精修同一思路.
    #
    # 斜率来源同日再改一次: 原先每轮无条件先转 yaw_probe_deg 试探一步实测, 代价是"小动
    # 一下 + 两次排空采样"约 2s 顿挫(用户实机反馈不利索). 而斜率四次实测符号从未翻过、
    # 量级只在 0.5~0.9 间, 这个精度对闭环足够(步长打 yaw_step_gain 折, 偏 20% 只多迭代
    # 一步, 终点精度只由 θ_img* 与容差决定). 故第一步直接按 yaw_slope_prior 下发;
    # 先验偏太多(含符号猜反)由单调性检查兜住 —— 一步后误差没降就回退去试探实测, 不中止.
    yaw_slope_prior: 0.8            # 先验 dθ_img/dψ. 实测 +0.83~+0.86(正侧) / +0.48(-40°侧)
    #
    # ⚠️ 2026-07-28 撤回两个错误诊断: ①"OBB 退化致假值"(±88° 时 conf 0.83 框全稳, 是真值);
    # ②"斜率连符号都会翻"(实测同号). 真身是 rotateToolYawBy 的 90° 等价折叠把下发步长换成
    # 反号分支(请求 +60° 实走 -30°). 该折叠已删: θ_img 折到 (-90,90] 即判据是 180° 周期的,
    # 姿态转 90° 后 θ_img 读出 90° 误差而非 0, 与 90° 折叠根本不兼容.
    yaw_probe_deg: 10.0             # 回退试探的步幅(度). 检测噪声 ±1° -> 信噪比 10:1
    yaw_slope_min: 0.3              # |dθ_img/dψ| 下限, 低于此判"检测不跟随腕转", 中止
    yaw_step_gain: 0.9              # 解出步长打的折, 留余量吸收斜率局部非线性
    yaw_max_step_deg: 60.0          # 单步转动上限(度), 兜住斜率量歪
    yaw_align_max_steps: 4          # 迭代上限. 斜率实测准的话 1~2 步就落容差
    # 每次判据前平均几帧 θ_img (检测 ~11Hz). 5 -> 3: 实测停稳后 60 帧散布仅 0.4°, 平均本
    # 就不是为了压噪声而是防单帧退化, 而那个由 axis_min_concentration 一致性门管; 3 帧够。
    axis_avg_frames: 3
    # 采 θ_img 前先丢弃这么多秒内到的帧, 排空视觉管线. settle() 只等关节停稳, 但相机曝光
    # 到 NCNN 出结果有一整段延迟, 臂停下那刻管线里积压的仍是运动中拍的画面; 时间戳是接收
    # 时刻不是曝光时刻, 判不出某帧拍于何时, 只能按延迟上界等过去.
    # 2026-07-28 实测: ② 结束后 0.36s 采到 +10.9°, 同一姿态停稳后稳定读 -45.1°(60帧散布
    # 0.4°) —— 那个坏数把试探斜率算成 6.21(真值 ~0.8), 整段对齐随之失败.
    # 0.5 -> 0.3: 0.5 是当初不知延迟上界时给的保守值. 缩短余量后若又采到运动中的坏帧,
    # 一致性门(axis_min_concentration)会拒掉重采, 不会像 07-28 那次直接把斜率算成 6.21.
    axis_flush_sec: 0.3
    # θ_img 帧间一致性下限 (2θ 空间合成向量集中度, 全一致=1). 长短边互换在 2θ 空间是 180°
    # 反向, 几帧 -45° 混几帧 +45° 求和互相抵消, atan2(0,0) 吐出 0 —— 一个任何单帧里都不存在
    # 的值, 却看着像"已对齐". 近正方形盒长宽比仅 1.11~1.14, 互换本就容易发生.
    # 2026-07-28 实测: 原始帧全 -44°, 本段首次采样却报 +2.5°(前一轮 +10.9°), 正是这个抵消;
    # 假值把试探斜率算成 5.4~6.2(真值 ~0.9), 一步只转几度, 整段对齐失败.
    # 0.9 对应帧间散布约 ±25°, 远松于实测的 ±0.5°, 只拦真正的互换.
    axis_min_concentration: 0.9
    axis_resample_tries: 4          # 不一致时最多重采几次(每次隔 axis_flush_sec), 全败才中止

    # ---- 折叠边界 / 跑飞保护 ----
    # θ_img 折到 (-90,90], 贴边界时**值本身可能是真的**(2026-07-28 实测 -88° 就是真值,
    # 检测全程健康), 但那里做差/求斜率都可能翻符号, 单帧判不出方向 -> 拦掉让上层中止,
    # 而不是拿它算步长. 中止是安全的: 此刻还没吸盒子, 臂停在 pregrasp 高度.
    yaw_bad_theta_deg: 85.0
    yaw_align_max_turn_deg: 120.0   # 本段累计转动上限(含试探步), 防斜率量歪把腕转到乱姿态
    # 另有单调性检查(代码内, 无参数): 一步后误差没降到上一步的 0.8 倍以下即中止(斜率已变).

    # (原 square_categories 已废: 近正方形盒的 90° 等价折叠与 θ_img 判据不兼容, 见上.
    #  现所有类别一律只按 180° 折叠.)

    # 长轴图像角话题, 须与 mm_perception/config/yolo_box_detector.yaml 的同名参数一致.
    axis_angle_topic: /perception/object_axis_angle
